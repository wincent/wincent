# Base24 Berlin
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#707070,bg=#0e0e0e"

# default window title colors
set-window-option -g window-status-style "fg=#707070,bg=#0e0e0e"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffffff,bg=#0e0e0e"

# pane border
set-option -g pane-border-style "fg=#0e0e0e"
set-option -g pane-active-border-style "fg=#707070"

# message text
set-option -g message-style "fg=#d6d6d6,bg=#181818"

# pane number display
set-option -g display-panes-active-colour "#707070"
set-option -g display-panes-colour "#0e0e0e"

# clock
set-window-option -g clock-mode-colour "#888888"

# copy mode highlight
set-window-option -g mode-style "fg=#707070,bg=#181818"

# bell
set-window-option -g window-status-bell-style "fg=#000000,bg=#999999"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cccccc,bg=#0e0e0e"

# style for command messages
set-option -g message-command-style "fg=#d6d6d6,bg=#181818"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cccccc,bg=#000000"
  set-window-option -g window-style "fg=#cccccc,bg=#0e0e0e"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cccccc,bg=#333333] #S #[fg=#333333,bg=#0e0e0e,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#181818,bg=#0e0e0e nobold, nounderscore, noitalics]#[fg=#707070,bg=#181818] %Y-%m-%d  %H:%M #[fg=#cccccc,bg=#181818,nobold,noitalics,nounderscore]#[fg=#0e0e0e,bg=#cccccc] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0e0e0e,bg=#dddddd,nobold,noitalics,nounderscore]#[fg=#181818,bg=#dddddd] #I #[fg=#181818,bg=#dddddd,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#dddddd,bg=#0e0e0e,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0e0e0e,bg=#181818,noitalics]#[fg=#d6d6d6,bg=#181818] #I #[fg=#d6d6d6,bg=#181818] #W#{?window_zoomed_flag,*Z,}} #[fg=#181818,bg=#0e0e0e,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
