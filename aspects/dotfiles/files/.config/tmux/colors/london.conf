# Base24 London
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#7a7a7a,bg=#f1f1f1"

# default window title colors
set-window-option -g window-status-style "fg=#7a7a7a,bg=#f1f1f1"

# active window title colors
set-window-option -g window-status-current-style "fg=#666666,bg=#f1f1f1"

# pane border
set-option -g pane-border-style "fg=#f1f1f1"
set-option -g pane-active-border-style "fg=#7a7a7a"

# message text
set-option -g message-style "fg=#242424,bg=#e7e7e7"

# pane number display
set-option -g display-panes-active-colour "#7a7a7a"
set-option -g display-panes-colour "#f1f1f1"

# clock
set-window-option -g clock-mode-colour "#666666"

# copy mode highlight
set-window-option -g mode-style "fg=#7a7a7a,bg=#e7e7e7"

# bell
set-window-option -g window-status-bell-style "fg=#ffffff,bg=#333333"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#333333,bg=#f1f1f1"

# style for command messages
set-option -g message-command-style "fg=#242424,bg=#e7e7e7"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#333333,bg=#ffffff"
  set-window-option -g window-style "fg=#333333,bg=#f1f1f1"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#333333,bg=#333333] #S #[fg=#333333,bg=#f1f1f1,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e7e7e7,bg=#f1f1f1 nobold, nounderscore, noitalics]#[fg=#7a7a7a,bg=#e7e7e7] %Y-%m-%d  %H:%M #[fg=#333333,bg=#e7e7e7,nobold,noitalics,nounderscore]#[fg=#f1f1f1,bg=#333333] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f1f1f1,bg=#555555,nobold,noitalics,nounderscore]#[fg=#e7e7e7,bg=#555555] #I #[fg=#e7e7e7,bg=#555555,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#555555,bg=#f1f1f1,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f1f1f1,bg=#e7e7e7,noitalics]#[fg=#242424,bg=#e7e7e7] #I #[fg=#242424,bg=#e7e7e7] #W#{?window_zoomed_flag,*Z,}} #[fg=#e7e7e7,bg=#f1f1f1,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
