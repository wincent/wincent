# Base24 Lumina Aurora Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#7e8987,bg=#e9f4f3"

# default window title colors
set-window-option -g window-status-style "fg=#7e8987,bg=#e9f4f3"

# active window title colors
set-window-option -g window-status-current-style "fg=#864e01,bg=#e9f4f3"

# pane border
set-option -g pane-border-style "fg=#e9f4f3"
set-option -g pane-active-border-style "fg=#7e8987"

# message text
set-option -g message-style "fg=#414a49,bg=#dde9e7"

# pane number display
set-option -g display-panes-active-colour "#7e8987"
set-option -g display-panes-colour "#e9f4f3"

# clock
set-window-option -g clock-mode-colour "#425b7a"

# copy mode highlight
set-window-option -g mode-style "fg=#7e8987,bg=#dde9e7"

# bell
set-window-option -g window-status-bell-style "fg=#f2faf9,bg=#942a28"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#163236,bg=#e9f4f3"

# style for command messages
set-option -g message-command-style "fg=#414a49,bg=#dde9e7"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#163236,bg=#f2faf9"
  set-window-option -g window-style "fg=#163236,bg=#e9f4f3"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#163236,bg=#cdd8d7] #S #[fg=#cdd8d7,bg=#e9f4f3,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dde9e7,bg=#e9f4f3 nobold, nounderscore, noitalics]#[fg=#7e8987,bg=#dde9e7] %Y-%m-%d  %H:%M #[fg=#163236,bg=#dde9e7,nobold,noitalics,nounderscore]#[fg=#e9f4f3,bg=#163236] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e9f4f3,bg=#9f6116,nobold,noitalics,nounderscore]#[fg=#dde9e7,bg=#9f6116] #I #[fg=#dde9e7,bg=#9f6116,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9f6116,bg=#e9f4f3,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e9f4f3,bg=#dde9e7,noitalics]#[fg=#414a49,bg=#dde9e7] #I #[fg=#414a49,bg=#dde9e7] #W#{?window_zoomed_flag,*Z,}} #[fg=#dde9e7,bg=#e9f4f3,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
