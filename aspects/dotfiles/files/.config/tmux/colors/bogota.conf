# Base24 Bogota
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#968a91,bg=#2f1b1b"

# default window title colors
set-window-option -g window-status-style "fg=#968a91,bg=#2f1b1b"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffed89,bg=#2f1b1b"

# pane border
set-option -g pane-border-style "fg=#2f1b1b"
set-option -g pane-active-border-style "fg=#968a91"

# message text
set-option -g message-style "fg=#f9f4ff,bg=#3a2727"

# pane number display
set-option -g display-panes-active-colour "#968a91"
set-option -g display-panes-colour "#2f1b1b"

# clock
set-window-option -g clock-mode-colour "#47e6ff"

# copy mode highlight
set-window-option -g mode-style "fg=#968a91,bg=#3a2727"

# bell
set-window-option -g window-status-bell-style "fg=#200b0a,bg=#fc618d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f7f1ff,bg=#2f1b1b"

# style for command messages
set-option -g message-command-style "fg=#f9f4ff,bg=#3a2727"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f7f1ff,bg=#200b0a"
  set-window-option -g window-style "fg=#f7f1ff,bg=#2f1b1b"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f7f1ff,bg=#525053] #S #[fg=#525053,bg=#2f1b1b,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#3a2727,bg=#2f1b1b nobold, nounderscore, noitalics]#[fg=#968a91,bg=#3a2727] %Y-%m-%d  %H:%M #[fg=#f7f1ff,bg=#3a2727,nobold,noitalics,nounderscore]#[fg=#2f1b1b,bg=#f7f1ff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2f1b1b,bg=#ffed89,nobold,noitalics,nounderscore]#[fg=#3a2727,bg=#ffed89] #I #[fg=#3a2727,bg=#ffed89,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ffed89,bg=#2f1b1b,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2f1b1b,bg=#3a2727,noitalics]#[fg=#f9f4ff,bg=#3a2727] #I #[fg=#f9f4ff,bg=#3a2727] #W#{?window_zoomed_flag,*Z,}} #[fg=#3a2727,bg=#2f1b1b,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
