# Base24 Lumina Quartz Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#676a6d,bg=#1a1c1e"

# default window title colors
set-window-option -g window-status-style "fg=#676a6d,bg=#1a1c1e"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe5b1,bg=#1a1c1e"

# pane border
set-option -g pane-border-style "fg=#1a1c1e"
set-option -g pane-active-border-style "fg=#676a6d"

# message text
set-option -g message-style "fg=#b0b1b3,bg=#242527"

# pane number display
set-option -g display-panes-active-colour "#676a6d"
set-option -g display-panes-colour "#1a1c1e"

# clock
set-window-option -g clock-mode-colour "#b6ceed"

# copy mode highlight
set-window-option -g mode-style "fg=#676a6d,bg=#242527"

# bell
set-window-option -g window-status-bell-style "fg=#161719,bg=#c57c74"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#ccd0d3,bg=#1a1c1e"

# style for command messages
set-option -g message-command-style "fg=#b0b1b3,bg=#242527"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#ccd0d3,bg=#161719"
  set-window-option -g window-style "fg=#ccd0d3,bg=#1a1c1e"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#ccd0d3,bg=#2e2f31] #S #[fg=#2e2f31,bg=#1a1c1e,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#242527,bg=#1a1c1e nobold, nounderscore, noitalics]#[fg=#676a6d,bg=#242527] %Y-%m-%d  %H:%M #[fg=#ccd0d3,bg=#242527,nobold,noitalics,nounderscore]#[fg=#1a1c1e,bg=#ccd0d3] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1a1c1e,bg=#dfcfb0,nobold,noitalics,nounderscore]#[fg=#242527,bg=#dfcfb0] #I #[fg=#242527,bg=#dfcfb0,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#dfcfb0,bg=#1a1c1e,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1a1c1e,bg=#242527,noitalics]#[fg=#b0b1b3,bg=#242527] #I #[fg=#b0b1b3,bg=#242527] #W#{?window_zoomed_flag,*Z,}} #[fg=#242527,bg=#1a1c1e,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
