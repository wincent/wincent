# Base24 Lumina Olive Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#6a6e58,bg=#1f200f"

# default window title colors
set-window-option -g window-status-style "fg=#6a6e58,bg=#1f200f"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffdea7,bg=#1f200f"

# pane border
set-option -g pane-border-style "fg=#1f200f"
set-option -g pane-active-border-style "fg=#6a6e58"

# message text
set-option -g message-style "fg=#b1b2a5,bg=#282918"

# pane number display
set-option -g display-panes-active-colour "#6a6e58"
set-option -g display-panes-colour "#1f200f"

# clock
set-window-option -g clock-mode-colour "#a2c4f0"

# copy mode highlight
set-window-option -g mode-style "fg=#6a6e58,bg=#282918"

# bell
set-window-option -g window-status-bell-style "fg=#1a1b0c,bg=#d3726a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e1dfce,bg=#1f200f"

# style for command messages
set-option -g message-command-style "fg=#b1b2a5,bg=#282918"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e1dfce,bg=#1a1b0c"
  set-window-option -g window-style "fg=#e1dfce,bg=#1f200f"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e1dfce,bg=#323422] #S #[fg=#323422,bg=#1f200f,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#282918,bg=#1f200f nobold, nounderscore, noitalics]#[fg=#6a6e58,bg=#282918] %Y-%m-%d  %H:%M #[fg=#e1dfce,bg=#282918,nobold,noitalics,nounderscore]#[fg=#1f200f,bg=#e1dfce] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1f200f,bg=#ebc27c,nobold,noitalics,nounderscore]#[fg=#282918,bg=#ebc27c] #I #[fg=#282918,bg=#ebc27c,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ebc27c,bg=#1f200f,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1f200f,bg=#282918,noitalics]#[fg=#b1b2a5,bg=#282918] #I #[fg=#b1b2a5,bg=#282918] #W#{?window_zoomed_flag,*Z,}} #[fg=#282918,bg=#1f200f,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
