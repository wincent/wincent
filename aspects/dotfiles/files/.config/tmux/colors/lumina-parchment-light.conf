# Base24 Lumina Parchment Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#908369,bg=#efe9db"

# default window title colors
set-window-option -g window-status-style "fg=#908369,bg=#efe9db"

# active window title colors
set-window-option -g window-status-current-style "fg=#5f2f00,bg=#efe9db"

# pane border
set-option -g pane-border-style "fg=#efe9db"
set-option -g pane-active-border-style "fg=#908369"

# message text
set-option -g message-style "fg=#52462d,bg=#e4ddcf"

# pane number display
set-option -g display-panes-active-colour "#908369"
set-option -g display-panes-colour "#efe9db"

# clock
set-window-option -g clock-mode-colour "#2e5fb0"

# copy mode highlight
set-window-option -g mode-style "fg=#908369,bg=#e4ddcf"

# bell
set-window-option -g window-status-bell-style "fg=#f9efda,bg=#912918"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#352516,bg=#efe9db"

# style for command messages
set-option -g message-command-style "fg=#52462d,bg=#e4ddcf"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#352516,bg=#f9efda"
  set-window-option -g window-style "fg=#352516,bg=#efe9db"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#352516,bg=#d3cdbf] #S #[fg=#d3cdbf,bg=#efe9db,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e4ddcf,bg=#efe9db nobold, nounderscore, noitalics]#[fg=#908369,bg=#e4ddcf] %Y-%m-%d  %H:%M #[fg=#352516,bg=#e4ddcf,nobold,noitalics,nounderscore]#[fg=#efe9db,bg=#352516] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#efe9db,bg=#654935,nobold,noitalics,nounderscore]#[fg=#e4ddcf,bg=#654935] #I #[fg=#e4ddcf,bg=#654935,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#654935,bg=#efe9db,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#efe9db,bg=#e4ddcf,noitalics]#[fg=#52462d,bg=#e4ddcf] #I #[fg=#52462d,bg=#e4ddcf] #W#{?window_zoomed_flag,*Z,}} #[fg=#e4ddcf,bg=#efe9db,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
