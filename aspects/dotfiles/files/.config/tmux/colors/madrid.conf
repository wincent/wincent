# Base24 Madrid
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#686868,bg=#eaeaea"

# default window title colors
set-window-option -g window-status-style "fg=#686868,bg=#eaeaea"

# active window title colors
set-window-option -g window-status-current-style "fg=#8a6408,bg=#eaeaea"

# pane border
set-option -g pane-border-style "fg=#eaeaea"
set-option -g pane-active-border-style "fg=#686868"

# message text
set-option -g message-style "fg=#121212,bg=#dfdfdf"

# pane number display
set-option -g display-panes-active-colour "#686868"
set-option -g display-panes-colour "#eaeaea"

# clock
set-window-option -g clock-mode-colour "#007a9e"

# copy mode highlight
set-window-option -g mode-style "fg=#686868,bg=#dfdfdf"

# bell
set-window-option -g window-status-bell-style "fg=#fafafa,bg=#990026"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1a1a1a,bg=#eaeaea"

# style for command messages
set-option -g message-command-style "fg=#121212,bg=#dfdfdf"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1a1a1a,bg=#fafafa"
  set-window-option -g window-style "fg=#1a1a1a,bg=#eaeaea"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1a1a1a,bg=#4d4d4d] #S #[fg=#4d4d4d,bg=#eaeaea,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dfdfdf,bg=#eaeaea nobold, nounderscore, noitalics]#[fg=#686868,bg=#dfdfdf] %Y-%m-%d  %H:%M #[fg=#1a1a1a,bg=#dfdfdf,nobold,noitalics,nounderscore]#[fg=#eaeaea,bg=#1a1a1a] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#eaeaea,bg=#8a6408,nobold,noitalics,nounderscore]#[fg=#dfdfdf,bg=#8a6408] #I #[fg=#dfdfdf,bg=#8a6408,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#8a6408,bg=#eaeaea,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#eaeaea,bg=#dfdfdf,noitalics]#[fg=#121212,bg=#dfdfdf] #I #[fg=#121212,bg=#dfdfdf] #W#{?window_zoomed_flag,*Z,}} #[fg=#dfdfdf,bg=#eaeaea,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
