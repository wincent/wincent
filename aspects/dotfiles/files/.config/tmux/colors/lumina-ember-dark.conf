# Base24 Lumina Ember Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#6b6963,bg=#1c1a15"

# default window title colors
set-window-option -g window-status-style "fg=#6b6963,bg=#1c1a15"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe6a2,bg=#1c1a15"

# pane border
set-option -g pane-border-style "fg=#1c1a15"
set-option -g pane-active-border-style "fg=#6b6963"

# message text
set-option -g message-style "fg=#b3b1ad,bg=#25231e"

# pane number display
set-option -g display-panes-active-colour "#6b6963"
set-option -g display-panes-colour "#1c1a15"

# clock
set-window-option -g clock-mode-colour "#94bedc"

# copy mode highlight
set-window-option -g mode-style "fg=#6b6963,bg=#25231e"

# bell
set-window-option -g window-status-bell-style "fg=#171511,bg=#cb7870"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e4ddd0,bg=#1c1a15"

# style for command messages
set-option -g message-command-style "fg=#b3b1ad,bg=#25231e"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e4ddd0,bg=#171511"
  set-window-option -g window-style "fg=#e4ddd0,bg=#1c1a15"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e4ddd0,bg=#2f2d28] #S #[fg=#2f2d28,bg=#1c1a15,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#25231e,bg=#1c1a15 nobold, nounderscore, noitalics]#[fg=#6b6963,bg=#25231e] %Y-%m-%d  %H:%M #[fg=#e4ddd0,bg=#25231e,nobold,noitalics,nounderscore]#[fg=#1c1a15,bg=#e4ddd0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1c1a15,bg=#e5cc88,nobold,noitalics,nounderscore]#[fg=#25231e,bg=#e5cc88] #I #[fg=#25231e,bg=#e5cc88,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e5cc88,bg=#1c1a15,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1c1a15,bg=#25231e,noitalics]#[fg=#b3b1ad,bg=#25231e] #I #[fg=#b3b1ad,bg=#25231e] #W#{?window_zoomed_flag,*Z,}} #[fg=#25231e,bg=#1c1a15,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
