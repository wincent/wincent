# Base24 Github Dark High Contrast
# Scheme author: Tinted Theming (https://github.com/tinted-theming)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#9198a1,bg=#151b23"

# default window title colors
set-window-option -g window-status-style "fg=#9198a1,bg=#151b23"

# active window title colors
set-window-option -g window-status-current-style "fg=#f7c843,bg=#151b23"

# pane border
set-option -g pane-border-style "fg=#151b23"
set-option -g pane-active-border-style "fg=#9198a1"

# message text
set-option -g message-style "fg=#f0f6fc,bg=#2f3742"

# pane number display
set-option -g display-panes-active-colour "#9198a1"
set-option -g display-panes-colour "#151b23"

# clock
set-window-option -g clock-mode-colour "#71b7ff"

# copy mode highlight
set-window-option -g mode-style "fg=#9198a1,bg=#2f3742"

# bell
set-window-option -g window-status-bell-style "fg=#0d1117,bg=#ff9492"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d1d7e0,bg=#151b23"

# style for command messages
set-option -g message-command-style "fg=#f0f6fc,bg=#2f3742"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d1d7e0,bg=#0d1117"
  set-window-option -g window-style "fg=#d1d7e0,bg=#151b23"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d1d7e0,bg=#656c76] #S #[fg=#656c76,bg=#151b23,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2f3742,bg=#151b23 nobold, nounderscore, noitalics]#[fg=#9198a1,bg=#2f3742] %Y-%m-%d  %H:%M #[fg=#d1d7e0,bg=#2f3742,nobold,noitalics,nounderscore]#[fg=#151b23,bg=#d1d7e0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#151b23,bg=#f0b72f,nobold,noitalics,nounderscore]#[fg=#2f3742,bg=#f0b72f] #I #[fg=#2f3742,bg=#f0b72f,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f0b72f,bg=#151b23,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#151b23,bg=#2f3742,noitalics]#[fg=#f0f6fc,bg=#2f3742] #I #[fg=#f0f6fc,bg=#2f3742] #W#{?window_zoomed_flag,*Z,}} #[fg=#2f3742,bg=#151b23,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
