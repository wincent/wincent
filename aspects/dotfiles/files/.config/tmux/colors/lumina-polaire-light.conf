# Base24 Lumina Polaire Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#7d898a,bg=#e7f3f5"

# default window title colors
set-window-option -g window-status-style "fg=#7d898a,bg=#e7f3f5"

# active window title colors
set-window-option -g window-status-current-style "fg=#7f4700,bg=#e7f3f5"

# pane border
set-option -g pane-border-style "fg=#e7f3f5"
set-option -g pane-active-border-style "fg=#7d898a"

# message text
set-option -g message-style "fg=#404a4b,bg=#dbe8e9"

# pane number display
set-option -g display-panes-active-colour "#7d898a"
set-option -g display-panes-colour "#e7f3f5"

# clock
set-window-option -g clock-mode-colour "#3e5372"

# copy mode highlight
set-window-option -g mode-style "fg=#7d898a,bg=#dbe8e9"

# bell
set-window-option -g window-status-bell-style "fg=#f0f9fa,bg=#882322"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#17323f,bg=#e7f3f5"

# style for command messages
set-option -g message-command-style "fg=#404a4b,bg=#dbe8e9"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#17323f,bg=#f0f9fa"
  set-window-option -g window-style "fg=#17323f,bg=#e7f3f5"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#17323f,bg=#cbd7d9] #S #[fg=#cbd7d9,bg=#e7f3f5,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dbe8e9,bg=#e7f3f5 nobold, nounderscore, noitalics]#[fg=#7d898a,bg=#dbe8e9] %Y-%m-%d  %H:%M #[fg=#17323f,bg=#dbe8e9,nobold,noitalics,nounderscore]#[fg=#e7f3f5,bg=#17323f] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e7f3f5,bg=#965a1c,nobold,noitalics,nounderscore]#[fg=#dbe8e9,bg=#965a1c] #I #[fg=#dbe8e9,bg=#965a1c,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#965a1c,bg=#e7f3f5,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e7f3f5,bg=#dbe8e9,noitalics]#[fg=#404a4b,bg=#dbe8e9] #I #[fg=#404a4b,bg=#dbe8e9] #W#{?window_zoomed_flag,*Z,}} #[fg=#dbe8e9,bg=#e7f3f5,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
