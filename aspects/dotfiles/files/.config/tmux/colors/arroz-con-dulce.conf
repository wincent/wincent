# Base24 Arroz con Dulce
# Scheme author: Richard Martinez
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#765B45,bg=#F7EBD3"

# default window title colors
set-window-option -g window-status-style "fg=#765B45,bg=#F7EBD3"

# active window title colors
set-window-option -g window-status-current-style "fg=#855500,bg=#F7EBD3"

# pane border
set-option -g pane-border-style "fg=#F7EBD3"
set-option -g pane-active-border-style "fg=#765B45"

# message text
set-option -g message-style "fg=#321C14,bg=#EAD6B8"

# pane number display
set-option -g display-panes-active-colour "#765B45"
set-option -g display-panes-colour "#F7EBD3"

# clock
set-window-option -g clock-mode-colour "#5940A0"

# copy mode highlight
set-window-option -g mode-style "fg=#765B45,bg=#EAD6B8"

# bell
set-window-option -g window-status-bell-style "fg=#FFF8E7,bg=#A11D48"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#4A2C20,bg=#F7EBD3"

# style for command messages
set-option -g message-command-style "fg=#321C14,bg=#EAD6B8"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#4A2C20,bg=#FFF8E7"
  set-window-option -g window-style "fg=#4A2C20,bg=#F7EBD3"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#4A2C20,bg=#C8A77A] #S #[fg=#C8A77A,bg=#F7EBD3,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#EAD6B8,bg=#F7EBD3 nobold, nounderscore, noitalics]#[fg=#765B45,bg=#EAD6B8] %Y-%m-%d  %H:%M #[fg=#4A2C20,bg=#EAD6B8,nobold,noitalics,nounderscore]#[fg=#F7EBD3,bg=#4A2C20] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#F7EBD3,bg=#855500,nobold,noitalics,nounderscore]#[fg=#EAD6B8,bg=#855500] #I #[fg=#EAD6B8,bg=#855500,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#855500,bg=#F7EBD3,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#F7EBD3,bg=#EAD6B8,noitalics]#[fg=#321C14,bg=#EAD6B8] #I #[fg=#321C14,bg=#EAD6B8] #W#{?window_zoomed_flag,*Z,}} #[fg=#EAD6B8,bg=#F7EBD3,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
