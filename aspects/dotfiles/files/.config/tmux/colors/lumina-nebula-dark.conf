# Base24 Lumina Nebula Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#666b7e,bg=#1a1c2c"

# default window title colors
set-window-option -g window-status-style "fg=#666b7e,bg=#1a1c2c"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffdfba,bg=#1a1c2c"

# pane border
set-option -g pane-border-style "fg=#1a1c2c"
set-option -g pane-active-border-style "fg=#666b7e"

# message text
set-option -g message-style "fg=#aeb0be,bg=#242636"

# pane number display
set-option -g display-panes-active-colour "#666b7e"
set-option -g display-panes-colour "#1a1c2c"

# clock
set-window-option -g clock-mode-colour "#c6d6e8"

# copy mode highlight
set-window-option -g mode-style "fg=#666b7e,bg=#242636"

# bell
set-window-option -g window-status-bell-style "fg=#161826,bg=#d57068"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#dde1ec,bg=#1a1c2c"

# style for command messages
set-option -g message-command-style "fg=#aeb0be,bg=#242636"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#dde1ec,bg=#161826"
  set-window-option -g window-style "fg=#dde1ec,bg=#1a1c2c"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#dde1ec,bg=#2d3041] #S #[fg=#2d3041,bg=#1a1c2c,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#242636,bg=#1a1c2c nobold, nounderscore, noitalics]#[fg=#666b7e,bg=#242636] %Y-%m-%d  %H:%M #[fg=#dde1ec,bg=#242636,nobold,noitalics,nounderscore]#[fg=#1a1c2c,bg=#dde1ec] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1a1c2c,bg=#f3c085,nobold,noitalics,nounderscore]#[fg=#242636,bg=#f3c085] #I #[fg=#242636,bg=#f3c085,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f3c085,bg=#1a1c2c,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1a1c2c,bg=#242636,noitalics]#[fg=#aeb0be,bg=#242636] #I #[fg=#aeb0be,bg=#242636] #W#{?window_zoomed_flag,*Z,}} #[fg=#242636,bg=#1a1c2c,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
