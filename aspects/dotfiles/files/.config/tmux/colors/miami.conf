# Base24 Miami
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#88858c,bg=#111112"

# default window title colors
set-window-option -g window-status-style "fg=#88858c,bg=#111112"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffd84c,bg=#111112"

# pane border
set-option -g pane-border-style "fg=#111112"
set-option -g pane-active-border-style "fg=#88858c"

# message text
set-option -g message-style "fg=#f9f4ff,bg=#1e1d1f"

# pane number display
set-option -g display-panes-active-colour "#88858c"
set-option -g display-panes-colour "#111112"

# clock
set-window-option -g clock-mode-colour "#00ffa8"

# copy mode highlight
set-window-option -g mode-style "fg=#88858c,bg=#1e1d1f"

# bell
set-window-option -g window-status-bell-style "fg=#000000,bg=#ff4c8b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f7f1ff,bg=#111112"

# style for command messages
set-option -g message-command-style "fg=#f9f4ff,bg=#1e1d1f"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f7f1ff,bg=#000000"
  set-window-option -g window-style "fg=#f7f1ff,bg=#111112"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f7f1ff,bg=#69676c] #S #[fg=#69676c,bg=#111112,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#1e1d1f,bg=#111112 nobold, nounderscore, noitalics]#[fg=#88858c,bg=#1e1d1f] %Y-%m-%d  %H:%M #[fg=#f7f1ff,bg=#1e1d1f,nobold,noitalics,nounderscore]#[fg=#111112,bg=#f7f1ff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#111112,bg=#ffd84c,nobold,noitalics,nounderscore]#[fg=#1e1d1f,bg=#ffd84c] #I #[fg=#1e1d1f,bg=#ffd84c,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ffd84c,bg=#111112,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#111112,bg=#1e1d1f,noitalics]#[fg=#f9f4ff,bg=#1e1d1f] #I #[fg=#f9f4ff,bg=#1e1d1f] #W#{?window_zoomed_flag,*Z,}} #[fg=#1e1d1f,bg=#111112,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
