# Base24 Lumina Cherenkov Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#536a8b,bg=#031530"

# default window title colors
set-window-option -g window-status-style "fg=#536a8b,bg=#031530"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe6a4,bg=#031530"

# pane border
set-option -g pane-border-style "fg=#031530"
set-option -g pane-active-border-style "fg=#536a8b"

# message text
set-option -g message-style "fg=#a2b3ca,bg=#0a1f3b"

# pane number display
set-option -g display-panes-active-colour "#536a8b"
set-option -g display-panes-colour "#031530"

# clock
set-window-option -g clock-mode-colour "#4ca1ff"

# copy mode highlight
set-window-option -g mode-style "fg=#536a8b,bg=#0a1f3b"

# bell
set-window-option -g window-status-bell-style "fg=#021129,bg=#db6c64"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d7e7f5,bg=#031530"

# style for command messages
set-option -g message-command-style "fg=#a2b3ca,bg=#0a1f3b"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d7e7f5,bg=#021129"
  set-window-option -g window-style "fg=#d7e7f5,bg=#031530"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d7e7f5,bg=#142946] #S #[fg=#142946,bg=#031530,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#0a1f3b,bg=#031530 nobold, nounderscore, noitalics]#[fg=#536a8b,bg=#0a1f3b] %Y-%m-%d  %H:%M #[fg=#d7e7f5,bg=#0a1f3b,nobold,noitalics,nounderscore]#[fg=#031530,bg=#d7e7f5] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#031530,bg=#ead293,nobold,noitalics,nounderscore]#[fg=#0a1f3b,bg=#ead293] #I #[fg=#0a1f3b,bg=#ead293,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ead293,bg=#031530,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#031530,bg=#0a1f3b,noitalics]#[fg=#a2b3ca,bg=#0a1f3b] #I #[fg=#a2b3ca,bg=#0a1f3b] #W#{?window_zoomed_flag,*Z,}} #[fg=#0a1f3b,bg=#031530,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
