# Base24 Corduroy
# Scheme author: taysatte (https://github.com/taysatte)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#887b8c,bg=#261e2a"

# default window title colors
set-window-option -g window-status-style "fg=#887b8c,bg=#261e2a"

# active window title colors
set-window-option -g window-status-current-style "fg=#edb392,bg=#261e2a"

# pane border
set-option -g pane-border-style "fg=#261e2a"
set-option -g pane-active-border-style "fg=#887b8c"

# message text
set-option -g message-style "fg=#cdc8d0,bg=#2e2533"

# pane number display
set-option -g display-panes-active-colour "#887b8c"
set-option -g display-panes-colour "#261e2a"

# clock
set-window-option -g clock-mode-colour "#d27f91"

# copy mode highlight
set-window-option -g mode-style "fg=#887b8c,bg=#2e2533"

# bell
set-window-option -g window-status-bell-style "fg=#1d1920,bg=#e06278"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#cdc8d0,bg=#261e2a"

# style for command messages
set-option -g message-command-style "fg=#cdc8d0,bg=#2e2533"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#cdc8d0,bg=#1d1920"
  set-window-option -g window-style "fg=#cdc8d0,bg=#261e2a"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#cdc8d0,bg=#6f6373] #S #[fg=#6f6373,bg=#261e2a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2e2533,bg=#261e2a nobold, nounderscore, noitalics]#[fg=#887b8c,bg=#2e2533] %Y-%m-%d  %H:%M #[fg=#cdc8d0,bg=#2e2533,nobold,noitalics,nounderscore]#[fg=#261e2a,bg=#cdc8d0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#261e2a,bg=#edb392,nobold,noitalics,nounderscore]#[fg=#2e2533,bg=#edb392] #I #[fg=#2e2533,bg=#edb392,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#edb392,bg=#261e2a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#261e2a,bg=#2e2533,noitalics]#[fg=#cdc8d0,bg=#2e2533] #I #[fg=#cdc8d0,bg=#2e2533] #W#{?window_zoomed_flag,*Z,}} #[fg=#2e2533,bg=#261e2a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
