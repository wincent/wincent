# Base24 Lumina Cherenkov Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#82868f,bg=#edf1fb"

# default window title colors
set-window-option -g window-status-style "fg=#82868f,bg=#edf1fb"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#edf1fb"

# pane border
set-option -g pane-border-style "fg=#edf1fb"
set-option -g pane-active-border-style "fg=#82868f"

# message text
set-option -g message-style "fg=#44484f,bg=#e2e6ef"

# pane number display
set-option -g display-panes-active-colour "#82868f"
set-option -g display-panes-colour "#edf1fb"

# clock
set-window-option -g clock-mode-colour "#0a4fcc"

# copy mode highlight
set-window-option -g mode-style "fg=#82868f,bg=#e2e6ef"

# bell
set-window-option -g window-status-bell-style "fg=#f5f8ff,bg=#a32224"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1f2e53,bg=#edf1fb"

# style for command messages
set-option -g message-command-style "fg=#44484f,bg=#e2e6ef"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1f2e53,bg=#f5f8ff"
  set-window-option -g window-style "fg=#1f2e53,bg=#edf1fb"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1f2e53,bg=#d1d5df] #S #[fg=#d1d5df,bg=#edf1fb,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e2e6ef,bg=#edf1fb nobold, nounderscore, noitalics]#[fg=#82868f,bg=#e2e6ef] %Y-%m-%d  %H:%M #[fg=#1f2e53,bg=#e2e6ef,nobold,noitalics,nounderscore]#[fg=#edf1fb,bg=#1f2e53] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#edf1fb,bg=#a35f00,nobold,noitalics,nounderscore]#[fg=#e2e6ef,bg=#a35f00] #I #[fg=#e2e6ef,bg=#a35f00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a35f00,bg=#edf1fb,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#edf1fb,bg=#e2e6ef,noitalics]#[fg=#44484f,bg=#e2e6ef] #I #[fg=#44484f,bg=#e2e6ef] #W#{?window_zoomed_flag,*Z,}} #[fg=#e2e6ef,bg=#edf1fb,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
