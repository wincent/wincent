# Base24 Abyssal
# Scheme author: Joss Wright (https://www.weirddatascience.net)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#65737e,bg=#1b2b34"

# default window title colors
set-window-option -g window-status-style "fg=#65737e,bg=#1b2b34"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffee50,bg=#1b2b34"

# pane border
set-option -g pane-border-style "fg=#1b2b34"
set-option -g pane-active-border-style "fg=#65737e"

# message text
set-option -g message-style "fg=#e7e7f7,bg=#343d46"

# pane number display
set-option -g display-panes-active-colour "#65737e"
set-option -g display-panes-colour "#1b2b34"

# clock
set-window-option -g clock-mode-colour "#01a0e4"

# copy mode highlight
set-window-option -g mode-style "fg=#65737e,bg=#343d46"

# bell
set-window-option -g window-status-bell-style "fg=#000000,bg=#ff7518"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e0e4e7,bg=#1b2b34"

# style for command messages
set-option -g message-command-style "fg=#e7e7f7,bg=#343d46"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e0e4e7,bg=#000000"
  set-window-option -g window-style "fg=#e0e4e7,bg=#1b2b34"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e0e4e7,bg=#4f5b66] #S #[fg=#4f5b66,bg=#1b2b34,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#343d46,bg=#1b2b34 nobold, nounderscore, noitalics]#[fg=#65737e,bg=#343d46] %Y-%m-%d  %H:%M #[fg=#e0e4e7,bg=#343d46,nobold,noitalics,nounderscore]#[fg=#1b2b34,bg=#e0e4e7] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1b2b34,bg=#ffcc00,nobold,noitalics,nounderscore]#[fg=#343d46,bg=#ffcc00] #I #[fg=#343d46,bg=#ffcc00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ffcc00,bg=#1b2b34,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1b2b34,bg=#343d46,noitalics]#[fg=#e7e7f7,bg=#343d46] #I #[fg=#e7e7f7,bg=#343d46] #W#{?window_zoomed_flag,*Z,}} #[fg=#343d46,bg=#1b2b34,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
