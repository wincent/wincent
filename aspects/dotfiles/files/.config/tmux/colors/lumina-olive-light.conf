# Base24 Lumina Olive Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#898772,bg=#f0efe0"

# default window title colors
set-window-option -g window-status-style "fg=#898772,bg=#f0efe0"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#f0efe0"

# pane border
set-option -g pane-border-style "fg=#f0efe0"
set-option -g pane-active-border-style "fg=#898772"

# message text
set-option -g message-style "fg=#4a4935,bg=#e5e4d5"

# pane number display
set-option -g display-panes-active-colour "#898772"
set-option -g display-panes-colour "#f0efe0"

# clock
set-window-option -g clock-mode-colour "#3264a3"

# copy mode highlight
set-window-option -g mode-style "fg=#898772,bg=#e5e4d5"

# bell
set-window-option -g window-status-bell-style "fg=#f7f6e5,bg=#8a1f1f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#302e16,bg=#f0efe0"

# style for command messages
set-option -g message-command-style "fg=#4a4935,bg=#e5e4d5"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#302e16,bg=#f7f6e5"
  set-window-option -g window-style "fg=#302e16,bg=#f0efe0"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#302e16,bg=#d4d3c5] #S #[fg=#d4d3c5,bg=#f0efe0,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e5e4d5,bg=#f0efe0 nobold, nounderscore, noitalics]#[fg=#898772,bg=#e5e4d5] %Y-%m-%d  %H:%M #[fg=#302e16,bg=#e5e4d5,nobold,noitalics,nounderscore]#[fg=#f0efe0,bg=#302e16] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f0efe0,bg=#a16010,nobold,noitalics,nounderscore]#[fg=#e5e4d5,bg=#a16010] #I #[fg=#e5e4d5,bg=#a16010,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a16010,bg=#f0efe0,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f0efe0,bg=#e5e4d5,noitalics]#[fg=#4a4935,bg=#e5e4d5] #I #[fg=#4a4935,bg=#e5e4d5] #W#{?window_zoomed_flag,*Z,}} #[fg=#e5e4d5,bg=#f0efe0,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
