# Base24 Lumina Canopy Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#808a7d,bg=#e9f3e6"

# default window title colors
set-window-option -g window-status-style "fg=#808a7d,bg=#e9f3e6"

# active window title colors
set-window-option -g window-status-current-style "fg=#764600,bg=#e9f3e6"

# pane border
set-option -g pane-border-style "fg=#e9f3e6"
set-option -g pane-active-border-style "fg=#808a7d"

# message text
set-option -g message-style "fg=#424b3f,bg=#dde8db"

# pane number display
set-option -g display-panes-active-colour "#808a7d"
set-option -g display-panes-colour "#e9f3e6"

# clock
set-window-option -g clock-mode-colour "#046aa7"

# copy mode highlight
set-window-option -g mode-style "fg=#808a7d,bg=#dde8db"

# bell
set-window-option -g window-status-bell-style "fg=#f1f9ef,bg=#860c2c"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1e3323,bg=#e9f3e6"

# style for command messages
set-option -g message-command-style "fg=#424b3f,bg=#dde8db"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1e3323,bg=#f1f9ef"
  set-window-option -g window-style "fg=#1e3323,bg=#e9f3e6"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1e3323,bg=#cdd7cb] #S #[fg=#cdd7cb,bg=#e9f3e6,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dde8db,bg=#e9f3e6 nobold, nounderscore, noitalics]#[fg=#808a7d,bg=#dde8db] %Y-%m-%d  %H:%M #[fg=#1e3323,bg=#dde8db,nobold,noitalics,nounderscore]#[fg=#e9f3e6,bg=#1e3323] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e9f3e6,bg=#905705,nobold,noitalics,nounderscore]#[fg=#dde8db,bg=#905705] #I #[fg=#dde8db,bg=#905705,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#905705,bg=#e9f3e6,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e9f3e6,bg=#dde8db,noitalics]#[fg=#424b3f,bg=#dde8db] #I #[fg=#424b3f,bg=#dde8db] #W#{?window_zoomed_flag,*Z,}} #[fg=#dde8db,bg=#e9f3e6,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
