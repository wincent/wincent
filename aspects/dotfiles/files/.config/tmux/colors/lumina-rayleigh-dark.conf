# Base24 Lumina Rayleigh Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#567089,bg=#0b2237"

# default window title colors
set-window-option -g window-status-style "fg=#567089,bg=#0b2237"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe5ad,bg=#0b2237"

# pane border
set-option -g pane-border-style "fg=#0b2237"
set-option -g pane-active-border-style "fg=#567089"

# message text
set-option -g message-style "fg=#a2b3c5,bg=#152c42"

# pane number display
set-option -g display-panes-active-colour "#567089"
set-option -g display-panes-colour "#0b2237"

# clock
set-window-option -g clock-mode-colour "#6fc3ff"

# copy mode highlight
set-window-option -g mode-style "fg=#567089,bg=#152c42"

# bell
set-window-option -g window-status-bell-style "fg=#091d30,bg=#d96d65"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d4dfeb,bg=#0b2237"

# style for command messages
set-option -g message-command-style "fg=#a2b3c5,bg=#152c42"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d4dfeb,bg=#091d30"
  set-window-option -g window-style "fg=#d4dfeb,bg=#0b2237"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d4dfeb,bg=#1f364d] #S #[fg=#1f364d,bg=#0b2237,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#152c42,bg=#0b2237 nobold, nounderscore, noitalics]#[fg=#567089,bg=#152c42] %Y-%m-%d  %H:%M #[fg=#d4dfeb,bg=#152c42,nobold,noitalics,nounderscore]#[fg=#0b2237,bg=#d4dfeb] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0b2237,bg=#f1cc79,nobold,noitalics,nounderscore]#[fg=#152c42,bg=#f1cc79] #I #[fg=#152c42,bg=#f1cc79,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f1cc79,bg=#0b2237,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0b2237,bg=#152c42,noitalics]#[fg=#a2b3c5,bg=#152c42] #I #[fg=#a2b3c5,bg=#152c42] #W#{?window_zoomed_flag,*Z,}} #[fg=#152c42,bg=#0b2237,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
