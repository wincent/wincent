# Base24 Lumina Espresso Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#928373,bg=#f5eade"

# default window title colors
set-window-option -g window-status-style "fg=#928373,bg=#f5eade"

# active window title colors
set-window-option -g window-status-current-style "fg=#653400,bg=#f5eade"

# pane border
set-option -g pane-border-style "fg=#f5eade"
set-option -g pane-active-border-style "fg=#928373"

# message text
set-option -g message-style "fg=#524536,bg=#e9ded2"

# pane number display
set-option -g display-panes-active-colour "#928373"
set-option -g display-panes-colour "#f5eade"

# clock
set-window-option -g clock-mode-colour "#2868a3"

# copy mode highlight
set-window-option -g mode-style "fg=#928373,bg=#e9ded2"

# bell
set-window-option -g window-status-bell-style "fg=#fcf0e3,bg=#842120"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#39261b,bg=#f5eade"

# style for command messages
set-option -g message-command-style "fg=#524536,bg=#e9ded2"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#39261b,bg=#fcf0e3"
  set-window-option -g window-style "fg=#39261b,bg=#f5eade"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#39261b,bg=#d9cec2] #S #[fg=#d9cec2,bg=#f5eade,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e9ded2,bg=#f5eade nobold, nounderscore, noitalics]#[fg=#928373,bg=#e9ded2] %Y-%m-%d  %H:%M #[fg=#39261b,bg=#e9ded2,nobold,noitalics,nounderscore]#[fg=#f5eade,bg=#39261b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f5eade,bg=#6d4e36,nobold,noitalics,nounderscore]#[fg=#e9ded2,bg=#6d4e36] #I #[fg=#e9ded2,bg=#6d4e36,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#6d4e36,bg=#f5eade,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f5eade,bg=#e9ded2,noitalics]#[fg=#524536,bg=#e9ded2] #I #[fg=#524536,bg=#e9ded2] #W#{?window_zoomed_flag,*Z,}} #[fg=#e9ded2,bg=#f5eade,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
