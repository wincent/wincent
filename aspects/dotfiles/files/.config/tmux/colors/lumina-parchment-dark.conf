# Base24 Lumina Parchment Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#7f7162,bg=#302619"

# default window title colors
set-window-option -g window-status-style "fg=#7f7162,bg=#302619"

# active window title colors
set-window-option -g window-status-current-style "fg=#fad484,bg=#302619"

# pane border
set-option -g pane-border-style "fg=#302619"
set-option -g pane-active-border-style "fg=#7f7162"

# message text
set-option -g message-style "fg=#b8b0a6,bg=#3a3023"

# pane number display
set-option -g display-panes-active-colour "#7f7162"
set-option -g display-panes-colour "#302619"

# clock
set-window-option -g clock-mode-colour "#97bdf4"

# copy mode highlight
set-window-option -g mode-style "fg=#7f7162,bg=#3a3023"

# bell
set-window-option -g window-status-bell-style "fg=#2a2116,bg=#d47169"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#efe5d0,bg=#302619"

# style for command messages
set-option -g message-command-style "fg=#b8b0a6,bg=#3a3023"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#efe5d0,bg=#2a2116"
  set-window-option -g window-style "fg=#efe5d0,bg=#302619"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#efe5d0,bg=#443a2d] #S #[fg=#443a2d,bg=#302619,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#3a3023,bg=#302619 nobold, nounderscore, noitalics]#[fg=#7f7162,bg=#3a3023] %Y-%m-%d  %H:%M #[fg=#efe5d0,bg=#3a3023,nobold,noitalics,nounderscore]#[fg=#302619,bg=#efe5d0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#302619,bg=#e0ba6a,nobold,noitalics,nounderscore]#[fg=#3a3023,bg=#e0ba6a] #I #[fg=#3a3023,bg=#e0ba6a,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e0ba6a,bg=#302619,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#302619,bg=#3a3023,noitalics]#[fg=#b8b0a6,bg=#3a3023] #I #[fg=#b8b0a6,bg=#3a3023] #W#{?window_zoomed_flag,*Z,}} #[fg=#3a3023,bg=#302619,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
