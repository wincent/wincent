# Base24 Tokio
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#949199,bg=#2b2b2d"

# default window title colors
set-window-option -g window-status-style "fg=#949199,bg=#2b2b2d"

# active window title colors
set-window-option -g window-status-current-style "fg=#fce566,bg=#2b2b2d"

# pane border
set-option -g pane-border-style "fg=#2b2b2d"
set-option -g pane-active-border-style "fg=#949199"

# message text
set-option -g message-style "fg=#f9f4ff,bg=#363638"

# pane number display
set-option -g display-panes-active-colour "#949199"
set-option -g display-panes-colour "#2b2b2d"

# clock
set-window-option -g clock-mode-colour "#fd9353"

# copy mode highlight
set-window-option -g mode-style "fg=#949199,bg=#363638"

# bell
set-window-option -g window-status-bell-style "fg=#1c1c1d,bg=#fc618d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f7f1ff,bg=#2b2b2d"

# style for command messages
set-option -g message-command-style "fg=#f9f4ff,bg=#363638"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f7f1ff,bg=#1c1c1d"
  set-window-option -g window-style "fg=#f7f1ff,bg=#2b2b2d"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f7f1ff,bg=#78757c] #S #[fg=#78757c,bg=#2b2b2d,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#363638,bg=#2b2b2d nobold, nounderscore, noitalics]#[fg=#949199,bg=#363638] %Y-%m-%d  %H:%M #[fg=#f7f1ff,bg=#363638,nobold,noitalics,nounderscore]#[fg=#2b2b2d,bg=#f7f1ff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2b2b2d,bg=#fce566,nobold,noitalics,nounderscore]#[fg=#363638,bg=#fce566] #I #[fg=#363638,bg=#fce566,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fce566,bg=#2b2b2d,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2b2b2d,bg=#363638,noitalics]#[fg=#f9f4ff,bg=#363638] #I #[fg=#f9f4ff,bg=#363638] #W#{?window_zoomed_flag,*Z,}} #[fg=#363638,bg=#2b2b2d,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
