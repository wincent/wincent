# Base24 Aftertaerm
# Scheme author: Radek Polasek (https://github.com/radekp31), based on Taerminal by cozywigwam
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#a8a8a8,bg=#303234"

# default window title colors
set-window-option -g window-status-style "fg=#a8a8a8,bg=#303234"

# active window title colors
set-window-option -g window-status-current-style "fg=#fffed5,bg=#303234"

# pane border
set-option -g pane-border-style "fg=#303234"
set-option -g pane-active-border-style "fg=#a8a8a8"

# message text
set-option -g message-style "fg=#f1f1f1,bg=#3c3e41"

# pane number display
set-option -g display-panes-active-colour "#a8a8a8"
set-option -g display-panes-colour "#303234"

# clock
set-window-option -g clock-mode-colour "#8bbce5"

# copy mode highlight
set-window-option -g mode-style "fg=#a8a8a8,bg=#3c3e41"

# bell
set-window-option -g window-status-bell-style "fg=#26282a,bg=#ff8878"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f0f0f0,bg=#303234"

# style for command messages
set-option -g message-command-style "fg=#f1f1f1,bg=#3c3e41"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f0f0f0,bg=#26282a"
  set-window-option -g window-style "fg=#f0f0f0,bg=#303234"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f0f0f0,bg=#6f6f6f] #S #[fg=#6f6f6f,bg=#303234,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#3c3e41,bg=#303234 nobold, nounderscore, noitalics]#[fg=#a8a8a8,bg=#3c3e41] %Y-%m-%d  %H:%M #[fg=#f0f0f0,bg=#3c3e41,nobold,noitalics,nounderscore]#[fg=#303234,bg=#f0f0f0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#303234,bg=#fffcb7,nobold,noitalics,nounderscore]#[fg=#3c3e41,bg=#fffcb7] #I #[fg=#3c3e41,bg=#fffcb7,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fffcb7,bg=#303234,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#303234,bg=#3c3e41,noitalics]#[fg=#f1f1f1,bg=#3c3e41] #I #[fg=#f1f1f1,bg=#3c3e41] #W#{?window_zoomed_flag,*Z,}} #[fg=#3c3e41,bg=#303234,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
