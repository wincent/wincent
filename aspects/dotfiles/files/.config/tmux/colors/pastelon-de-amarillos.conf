# Base24 Pastelón de Amarillos
# Scheme author: Richard Martinez (https://sonofmartinus.com)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#684653,bg=#f2d083"

# default window title colors
set-window-option -g window-status-style "fg=#684653,bg=#f2d083"

# active window title colors
set-window-option -g window-status-current-style "fg=#007b4e,bg=#f2d083"

# pane border
set-option -g pane-border-style "fg=#f2d083"
set-option -g pane-active-border-style "fg=#684653"

# message text
set-option -g message-style "fg=#2f1c2e,bg=#d69b45"

# pane number display
set-option -g display-panes-active-colour "#684653"
set-option -g display-panes-colour "#f2d083"

# clock
set-window-option -g clock-mode-colour "#365f91"

# copy mode highlight
set-window-option -g mode-style "fg=#684653,bg=#d69b45"

# bell
set-window-option -g window-status-bell-style "fg=#fff4d6,bg=#a63d4a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#432c3b,bg=#f2d083"

# style for command messages
set-option -g message-command-style "fg=#2f1c2e,bg=#d69b45"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#432c3b,bg=#fff4d6"
  set-window-option -g window-style "fg=#432c3b,bg=#f2d083"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#432c3b,bg=#80616b] #S #[fg=#80616b,bg=#f2d083,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#d69b45,bg=#f2d083 nobold, nounderscore, noitalics]#[fg=#684653,bg=#d69b45] %Y-%m-%d  %H:%M #[fg=#432c3b,bg=#d69b45,nobold,noitalics,nounderscore]#[fg=#f2d083,bg=#432c3b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f2d083,bg=#846600,nobold,noitalics,nounderscore]#[fg=#d69b45,bg=#846600] #I #[fg=#d69b45,bg=#846600,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#846600,bg=#f2d083,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f2d083,bg=#d69b45,noitalics]#[fg=#2f1c2e,bg=#d69b45] #I #[fg=#2f1c2e,bg=#d69b45] #W#{?window_zoomed_flag,*Z,}} #[fg=#d69b45,bg=#f2d083,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
