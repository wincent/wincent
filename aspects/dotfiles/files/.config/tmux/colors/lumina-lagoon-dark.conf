# Base24 Lumina Lagoon Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#547c86,bg=#042e36"

# default window title colors
set-window-option -g window-status-style "fg=#547c86,bg=#042e36"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe6a7,bg=#042e36"

# pane border
set-option -g pane-border-style "fg=#042e36"
set-option -g pane-active-border-style "fg=#547c86"

# message text
set-option -g message-style "fg=#9db6bc,bg=#103941"

# pane number display
set-option -g display-panes-active-colour "#547c86"
set-option -g display-panes-colour "#042e36"

# clock
set-window-option -g clock-mode-colour "#8ec3f9"

# copy mode highlight
set-window-option -g mode-style "fg=#547c86,bg=#103941"

# bell
set-window-option -g window-status-bell-style "fg=#042930,bg=#d3726a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d7e6e7,bg=#042e36"

# style for command messages
set-option -g message-command-style "fg=#9db6bc,bg=#103941"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d7e6e7,bg=#042930"
  set-window-option -g window-style "fg=#d7e6e7,bg=#042e36"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d7e6e7,bg=#1c434b] #S #[fg=#1c434b,bg=#042e36,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#103941,bg=#042e36 nobold, nounderscore, noitalics]#[fg=#547c86,bg=#103941] %Y-%m-%d  %H:%M #[fg=#d7e6e7,bg=#103941,nobold,noitalics,nounderscore]#[fg=#042e36,bg=#d7e6e7] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#042e36,bg=#e7cf94,nobold,noitalics,nounderscore]#[fg=#103941,bg=#e7cf94] #I #[fg=#103941,bg=#e7cf94,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e7cf94,bg=#042e36,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#042e36,bg=#103941,noitalics]#[fg=#9db6bc,bg=#103941] #I #[fg=#9db6bc,bg=#103941] #W#{?window_zoomed_flag,*Z,}} #[fg=#103941,bg=#042e36,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
