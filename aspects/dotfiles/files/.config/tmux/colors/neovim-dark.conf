# Base24 Neovim Dark
# Scheme author: https://github.com/neovim/neovim/blob/master/src/nvim/highlight_group.c
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#c4c6cd,bg=#07080d"

# default window title colors
set-window-option -g window-status-style "fg=#c4c6cd,bg=#07080d"

# active window title colors
set-window-option -g window-status-current-style "fg=#fce094,bg=#07080d"

# pane border
set-option -g pane-border-style "fg=#07080d"
set-option -g pane-active-border-style "fg=#c4c6cd"

# message text
set-option -g message-style "fg=#eef1f8,bg=#4f5258"

# pane number display
set-option -g display-panes-active-colour "#c4c6cd"
set-option -g display-panes-colour "#07080d"

# clock
set-window-option -g clock-mode-colour "#a6dbff"

# copy mode highlight
set-window-option -g mode-style "fg=#c4c6cd,bg=#4f5258"

# bell
set-window-option -g window-status-bell-style "fg=#14161b,bg=#ffc0b9"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e0e2ea,bg=#07080d"

# style for command messages
set-option -g message-command-style "fg=#eef1f8,bg=#4f5258"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e0e2ea,bg=#14161b"
  set-window-option -g window-style "fg=#e0e2ea,bg=#07080d"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e0e2ea,bg=#9b9ea4] #S #[fg=#9b9ea4,bg=#07080d,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#4f5258,bg=#07080d nobold, nounderscore, noitalics]#[fg=#c4c6cd,bg=#4f5258] %Y-%m-%d  %H:%M #[fg=#e0e2ea,bg=#4f5258,nobold,noitalics,nounderscore]#[fg=#07080d,bg=#e0e2ea] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#07080d,bg=#fce094,nobold,noitalics,nounderscore]#[fg=#4f5258,bg=#fce094] #I #[fg=#4f5258,bg=#fce094,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fce094,bg=#07080d,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#07080d,bg=#4f5258,noitalics]#[fg=#eef1f8,bg=#4f5258] #I #[fg=#eef1f8,bg=#4f5258] #W#{?window_zoomed_flag,*Z,}} #[fg=#4f5258,bg=#07080d,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
