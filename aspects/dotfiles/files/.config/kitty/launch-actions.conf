# kitty launch-actions: what to do when the *OS* asks kitty to open something
# (Finder's "Open in kitty", `open -a kitty`, any other LaunchServices
# invocation).
#
# This is a different file, and a different code path, from
# "open-actions.conf", which only covers links clicked inside a kitty window.
# Without this file, an OS-level open falls back to kitty's built-in rules,
# which match on MIME type and therefore fail with "Unknown URL type, cannot
# open" for anything kitty cannot classify: .patch, .diff, .lua, .go, .rs,
# .ini, .erb, .sql and Dockerfile, among others, plus .ts (guessed as
# video/mp2t) and .rs (application/rls-services+xml).
#
# Matching stops at the first rule that matches. If nothing here matches a
# given URL, kitty still falls back to its built-in defaults for that URL, so
# non-file protocols (eg. ssh) need no entry here. The catch-all at the bottom
# does match every file:// URL though, so the built-in file rules worth
# keeping have to be restated ahead of it.

# Note that kitty's built-in rules for scripts and executables are deliberately
# *not* reproduced here. They offer to run the file, and we would rather edit
# it. Dropping the two `ext` rules is not enough on its own: kitty reports any
# file with an executable bit as "inode/executable" when it cannot otherwise
# classify it, which covers every script in ".zsh/bin", so that rule has to go
# too. Genuine binaries are still safe, because nvim-open checks the file's
# MIME encoding and hands anything binary to `open`.

# Open directories in a shell (kitty's default).
protocol file
mime inode/directory
action launch --type=os-window --cwd -- $FILE_PATH

# Display images inline (kitty's default).
protocol file
mime image/*
action launch --type=os-window kitten icat --hold -- $FILE_PATH

# Everything else goes to nvim, through the same handler that
# "open-actions.conf" uses for clicked links, so a Finder open and a click land
# in the same place. Falls back to a new window when there is no nvim running.
protocol file
action launch --type=background ~/.config/kitty/launch-open $URL $FILE_PATH
