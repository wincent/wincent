# Scheme name: base24 Cerulean Signal Light
# Scheme author: Aaron Colichia (https://aaron.colichia.org/)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #f7f9fc
foreground #232b38
selection_background #232b38
selection_foreground #dde7f1

# Cursor colors
cursor #232b38
cursor_text_color #f7f9fc

# URL underline color when hovering with mouse
url_color #566579

# Kitty window border colors
active_border_color #637287
inactive_border_color #eef4fb

# OS Window titlebar colors
wayland_titlebar_color #f7f9fc
macos_titlebar_color #f7f9fc

# Tab bar colors
active_tab_background #f7f9fc
active_tab_foreground #232b38
inactive_tab_background #eef4fb
inactive_tab_foreground #566579
tab_bar_background #eef4fb

# The 16 terminal colors
# normal
color0 #f7f9fc
color1 #b4233d
color2 #17795e
color3 #6f6300
