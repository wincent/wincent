color5 #a0007d
color6 #00727e
color7 #232b38

# bright
color8 #637287
color9 #c7354d
color10 #247b4e
color11 #7b6500
color12 #0078b5
color13 #b5149e
color14 #007787
color15 #141d2a

# extended base16 colors
