# Scheme name: base24 Lichen Chartreuse Light
# Scheme author: Aaron Colichia (https://aaron.colichia.org/)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #f5f7f2
foreground #2d302b
selection_background #2d302b
selection_foreground #cfe4ae

# Cursor colors
cursor #2d302b
cursor_text_color #f5f7f2

# URL underline color when hovering with mouse
