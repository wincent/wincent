# Base24 Lumina Polaire Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#5e6d77,bg=#121f27"

# default window title colors
set-window-option -g window-status-style "fg=#5e6d77,bg=#121f27"

# active window title colors
set-window-option -g window-status-current-style "fg=#fde099,bg=#121f27"

# pane border
set-option -g pane-border-style "fg=#121f27"
set-option -g pane-active-border-style "fg=#5e6d77"

# message text
set-option -g message-style "fg=#a9b3b9,bg=#1c2831"

# pane number display
set-option -g display-panes-active-colour "#5e6d77"
set-option -g display-panes-colour "#121f27"

# clock
set-window-option -g clock-mode-colour "#aeccf2"

# copy mode highlight
set-window-option -g mode-style "fg=#5e6d77,bg=#1c2831"

# bell
set-window-option -g window-status-bell-style "fg=#0f1a21,bg=#cd776f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d7e1e8,bg=#121f27"

# style for command messages
set-option -g message-command-style "fg=#a9b3b9,bg=#1c2831"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d7e1e8,bg=#0f1a21"
  set-window-option -g window-style "fg=#d7e1e8,bg=#121f27"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d7e1e8,bg=#25323b] #S #[fg=#25323b,bg=#121f27,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#1c2831,bg=#121f27 nobold, nounderscore, noitalics]#[fg=#5e6d77,bg=#1c2831] %Y-%m-%d  %H:%M #[fg=#d7e1e8,bg=#1c2831,nobold,noitalics,nounderscore]#[fg=#121f27,bg=#d7e1e8] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#121f27,bg=#e2c682,nobold,noitalics,nounderscore]#[fg=#1c2831,bg=#e2c682] #I #[fg=#1c2831,bg=#e2c682,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e2c682,bg=#121f27,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#121f27,bg=#1c2831,noitalics]#[fg=#a9b3b9,bg=#1c2831] #I #[fg=#a9b3b9,bg=#1c2831] #W#{?window_zoomed_flag,*Z,}} #[fg=#1c2831,bg=#121f27,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
