# Tinted8 Github Light
# Scheme author: Tinted Theming (https://github.com/tinted-theming)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#1f2328,bg=#ffffff"

# default window title colors
set-window-option -g window-status-style "fg=#1f2328,bg=#ffffff"

# active window title colors
set-window-option -g window-status-current-style "fg=#4d2d00,bg=#ffffff"

# pane border
set-option -g pane-border-style "fg=#"
set-option -g pane-active-border-style "fg=#"

# message text
set-option -g message-style "fg=#040506,bg=#818b98"

# pane number display
set-option -g display-panes-active-colour "#"
set-option -g display-panes-colour "#818b98"

# clock
set-window-option -g clock-mode-colour "#0969da"

# copy mode highlight
set-window-option -g mode-style "fg=#59636e,bg=#3d454c"

# bell
set-window-option -g window-status-bell-style "fg=#ffffff,bg=#cf222e"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1f2328,bg=#ffffff"

# style for command messages
set-option -g message-command-style "fg=#040506,bg=#818b98"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1f2328,bg=#ffffff"
  set-window-option -g window-style "fg=#1f2328,bg=#f6f8fa"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1f2328,bg=#3d454c] #S #[fg=#3d454c,bg=#ffffff,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#818b98,bg=#ffffff nobold, nounderscore, noitalics]#[fg=#59636e,bg=#818b98] %Y-%m-%d  %H:%M #[fg=#1f2328,bg=#818b98,nobold,noitalics,nounderscore]#[fg=#ffffff,bg=#1f2328] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#ffffff,bg=#4d2d00,nobold,noitalics,nounderscore]#[fg=#818b98,bg=#4d2d00] #I #[fg=#818b98,bg=#4d2d00,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#4d2d00,bg=#ffffff,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#ffffff,bg=#818b98,noitalics]#[fg=#040506,bg=#818b98] #I #[fg=#040506,bg=#818b98] #W#{?window_zoomed_flag,*Z,} #[fg=#818b98,bg=#ffffff,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
