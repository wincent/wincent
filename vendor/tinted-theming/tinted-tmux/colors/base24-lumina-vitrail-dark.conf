# Base24 Lumina Vitrail Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#646876,bg=#0a0d17"

# default window title colors
set-window-option -g window-status-style "fg=#646876,bg=#0a0d17"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe6a7,bg=#0a0d17"

# pane border
set-option -g pane-border-style "fg=#0a0d17"
set-option -g pane-active-border-style "fg=#646876"

# message text
set-option -g message-style "fg=#aeb1ba,bg=#131621"

# pane number display
set-option -g display-panes-active-colour "#646876"
set-option -g display-panes-colour "#0a0d17"

# clock
set-window-option -g clock-mode-colour "#7299ff"

# copy mode highlight
set-window-option -g mode-style "fg=#646876,bg=#131621"

# bell
set-window-option -g window-status-bell-style "fg=#070912,bg=#ff763b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f1eee6,bg=#0a0d17"

# style for command messages
set-option -g message-command-style "fg=#aeb1ba,bg=#131621"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f1eee6,bg=#070912"
  set-window-option -g window-style "fg=#f1eee6,bg=#0a0d17"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f1eee6,bg=#1c1f2b] #S #[fg=#1c1f2b,bg=#0a0d17,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#131621,bg=#0a0d17 nobold, nounderscore, noitalics]#[fg=#646876,bg=#131621] %Y-%m-%d  %H:%M #[fg=#f1eee6,bg=#131621,nobold,noitalics,nounderscore]#[fg=#0a0d17,bg=#f1eee6] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0a0d17,bg=#fbca3f,nobold,noitalics,nounderscore]#[fg=#131621,bg=#fbca3f] #I #[fg=#131621,bg=#fbca3f,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fbca3f,bg=#0a0d17,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0a0d17,bg=#131621,noitalics]#[fg=#aeb1ba,bg=#131621] #I #[fg=#aeb1ba,bg=#131621] #W#{?window_zoomed_flag,*Z,}} #[fg=#131621,bg=#0a0d17,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
