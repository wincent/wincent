# Base24 Lumina Aurora Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#5a6d6d,bg=#061717"

# default window title colors
set-window-option -g window-status-style "fg=#5a6d6d,bg=#061717"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe791,bg=#061717"

# pane border
set-option -g pane-border-style "fg=#061717"
set-option -g pane-active-border-style "fg=#5a6d6d"

# message text
set-option -g message-style "fg=#a7b4b4,bg=#0f2020"

# pane number display
set-option -g display-panes-active-colour "#5a6d6d"
set-option -g display-panes-colour "#061717"

# clock
set-window-option -g clock-mode-colour "#c5d8ed"

# copy mode highlight
set-window-option -g mode-style "fg=#5a6d6d,bg=#0f2020"

# bell
set-window-option -g window-status-bell-style "fg=#041212,bg=#d86f66"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d6e3e2,bg=#061717"

# style for command messages
set-option -g message-command-style "fg=#a7b4b4,bg=#0f2020"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d6e3e2,bg=#041212"
  set-window-option -g window-style "fg=#d6e3e2,bg=#061717"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d6e3e2,bg=#182a2a] #S #[fg=#182a2a,bg=#061717,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#0f2020,bg=#061717 nobold, nounderscore, noitalics]#[fg=#5a6d6d,bg=#0f2020] %Y-%m-%d  %H:%M #[fg=#d6e3e2,bg=#0f2020,nobold,noitalics,nounderscore]#[fg=#061717,bg=#d6e3e2] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#061717,bg=#e9d487,nobold,noitalics,nounderscore]#[fg=#0f2020,bg=#e9d487] #I #[fg=#0f2020,bg=#e9d487,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e9d487,bg=#061717,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#061717,bg=#0f2020,noitalics]#[fg=#a7b4b4,bg=#0f2020] #I #[fg=#a7b4b4,bg=#0f2020] #W#{?window_zoomed_flag,*Z,}} #[fg=#0f2020,bg=#061717,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
