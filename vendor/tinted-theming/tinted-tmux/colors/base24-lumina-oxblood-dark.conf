# Base24 Lumina Oxblood Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#79616a,bg=#26131b"

# default window title colors
set-window-option -g window-status-style "fg=#79616a,bg=#26131b"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b8,bg=#26131b"

# pane border
set-option -g pane-border-style "fg=#26131b"
set-option -g pane-active-border-style "fg=#79616a"

# message text
set-option -g message-style "fg=#bdacb2,bg=#301c24"

# pane number display
set-option -g display-panes-active-colour "#79616a"
set-option -g display-panes-colour "#26131b"

# clock
set-window-option -g clock-mode-colour "#9ac3f8"

# copy mode highlight
set-window-option -g mode-style "fg=#79616a,bg=#301c24"

# bell
set-window-option -g window-status-bell-style "fg=#200f16,bg=#db6c63"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e8d6dc,bg=#26131b"

# style for command messages
set-option -g message-command-style "fg=#bdacb2,bg=#301c24"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e8d6dc,bg=#200f16"
  set-window-option -g window-style "fg=#e8d6dc,bg=#26131b"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e8d6dc,bg=#3b262e] #S #[fg=#3b262e,bg=#26131b,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#301c24,bg=#26131b nobold, nounderscore, noitalics]#[fg=#79616a,bg=#301c24] %Y-%m-%d  %H:%M #[fg=#e8d6dc,bg=#301c24,nobold,noitalics,nounderscore]#[fg=#26131b,bg=#e8d6dc] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#26131b,bg=#f9c875,nobold,noitalics,nounderscore]#[fg=#301c24,bg=#f9c875] #I #[fg=#301c24,bg=#f9c875,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#f9c875,bg=#26131b,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#26131b,bg=#301c24,noitalics]#[fg=#bdacb2,bg=#301c24] #I #[fg=#bdacb2,bg=#301c24] #W#{?window_zoomed_flag,*Z,}} #[fg=#301c24,bg=#26131b,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
