# Base24 Github Light High Contrast
# Scheme author: Tinted Theming (https://github.com/tinted-theming)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#59636e,bg=#f6f8fa"

# default window title colors
set-window-option -g window-status-style "fg=#59636e,bg=#f6f8fa"

# active window title colors
set-window-option -g window-status-current-style "fg=#4e2c00,bg=#f6f8fa"

# pane border
set-option -g pane-border-style "fg=#f6f8fa"
set-option -g pane-active-border-style "fg=#59636e"

# message text
set-option -g message-style "fg=#25292e,bg=#d1d9e0"

# pane number display
set-option -g display-panes-active-colour "#59636e"
set-option -g display-panes-colour "#f6f8fa"

# clock
set-window-option -g clock-mode-colour "#0349b4"

# copy mode highlight
set-window-option -g mode-style "fg=#59636e,bg=#d1d9e0"

# bell
set-window-option -g window-status-bell-style "fg=#ffffff,bg=#a0111f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#454c54,bg=#f6f8fa"

# style for command messages
set-option -g message-command-style "fg=#25292e,bg=#d1d9e0"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#454c54,bg=#ffffff"
  set-window-option -g window-style "fg=#454c54,bg=#f6f8fa"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#454c54,bg=#818b98] #S #[fg=#818b98,bg=#f6f8fa,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#d1d9e0,bg=#f6f8fa nobold, nounderscore, noitalics]#[fg=#59636e,bg=#d1d9e0] %Y-%m-%d  %H:%M #[fg=#454c54,bg=#d1d9e0,nobold,noitalics,nounderscore]#[fg=#f6f8fa,bg=#454c54] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f6f8fa,bg=#603700,nobold,noitalics,nounderscore]#[fg=#d1d9e0,bg=#603700] #I #[fg=#d1d9e0,bg=#603700,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#603700,bg=#f6f8fa,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f6f8fa,bg=#d1d9e0,noitalics]#[fg=#25292e,bg=#d1d9e0] #I #[fg=#25292e,bg=#d1d9e0] #W#{?window_zoomed_flag,*Z,}} #[fg=#d1d9e0,bg=#f6f8fa,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
