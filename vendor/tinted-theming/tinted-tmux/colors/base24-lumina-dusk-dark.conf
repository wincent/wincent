# Base24 Lumina Dusk Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#6d697d,bg=#1f1c2b"

# default window title colors
set-window-option -g window-status-style "fg=#6d697d,bg=#1f1c2b"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe5ad,bg=#1f1c2b"

# pane border
set-option -g pane-border-style "fg=#1f1c2b"
set-option -g pane-active-border-style "fg=#6d697d"

# message text
set-option -g message-style "fg=#b1afbc,bg=#282635"

# pane number display
set-option -g display-panes-active-colour "#6d697d"
set-option -g display-panes-colour "#1f1c2b"

# clock
set-window-option -g clock-mode-colour "#9bbef2"

# copy mode highlight
set-window-option -g mode-style "fg=#6d697d,bg=#282635"

# bell
set-window-option -g window-status-bell-style "fg=#1a1825,bg=#d0746c"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e0dcea,bg=#1f1c2b"

# style for command messages
set-option -g message-command-style "fg=#b1afbc,bg=#282635"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e0dcea,bg=#1a1825"
  set-window-option -g window-style "fg=#e0dcea,bg=#1f1c2b"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e0dcea,bg=#323040] #S #[fg=#323040,bg=#1f1c2b,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#282635,bg=#1f1c2b nobold, nounderscore, noitalics]#[fg=#6d697d,bg=#282635] %Y-%m-%d  %H:%M #[fg=#e0dcea,bg=#282635,nobold,noitalics,nounderscore]#[fg=#1f1c2b,bg=#e0dcea] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1f1c2b,bg=#efcb7b,nobold,noitalics,nounderscore]#[fg=#282635,bg=#efcb7b] #I #[fg=#282635,bg=#efcb7b,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#efcb7b,bg=#1f1c2b,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1f1c2b,bg=#282635,noitalics]#[fg=#b1afbc,bg=#282635] #I #[fg=#b1afbc,bg=#282635] #W#{?window_zoomed_flag,*Z,}} #[fg=#282635,bg=#1f1c2b,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
