# Base24 Lumina Nebula Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#888391,bg=#f2edfb"

# default window title colors
set-window-option -g window-status-style "fg=#888391,bg=#f2edfb"

# active window title colors
set-window-option -g window-status-current-style "fg=#7a4a00,bg=#f2edfb"

# pane border
set-option -g pane-border-style "fg=#f2edfb"
set-option -g pane-active-border-style "fg=#888391"

# message text
set-option -g message-style "fg=#4a4551,bg=#e6e1ef"

# pane number display
set-option -g display-panes-active-colour "#888391"
set-option -g display-panes-colour "#f2edfb"

# clock
set-window-option -g clock-mode-colour "#3f5777"

# copy mode highlight
set-window-option -g mode-style "fg=#888391,bg=#e6e1ef"

# bell
set-window-option -g window-status-bell-style "fg=#f8f4ff,bg=#932222"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#2d2c46,bg=#f2edfb"

# style for command messages
set-option -g message-command-style "fg=#4a4551,bg=#e6e1ef"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#2d2c46,bg=#f8f4ff"
  set-window-option -g window-style "fg=#2d2c46,bg=#f2edfb"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#2d2c46,bg=#d6d1df] #S #[fg=#d6d1df,bg=#f2edfb,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e6e1ef,bg=#f2edfb nobold, nounderscore, noitalics]#[fg=#888391,bg=#e6e1ef] %Y-%m-%d  %H:%M #[fg=#2d2c46,bg=#e6e1ef,nobold,noitalics,nounderscore]#[fg=#f2edfb,bg=#2d2c46] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f2edfb,bg=#955b01,nobold,noitalics,nounderscore]#[fg=#e6e1ef,bg=#955b01] #I #[fg=#e6e1ef,bg=#955b01,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#955b01,bg=#f2edfb,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f2edfb,bg=#e6e1ef,noitalics]#[fg=#4a4551,bg=#e6e1ef] #I #[fg=#4a4551,bg=#e6e1ef] #W#{?window_zoomed_flag,*Z,}} #[fg=#e6e1ef,bg=#f2edfb,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
