# Base16 Praha
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#ffffff,bg=#1a1a1a"

# default window title colors
set-window-option -g window-status-style "fg=#ffffff,bg=#1a1a1a"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4a3,bg=#1a1a1a"

# pane border
set-option -g pane-border-style "fg=#2a2a2a"
set-option -g pane-active-border-style "fg=#989898"

# message text
set-option -g message-style "fg=#ffffff,bg=#2a2a2a"

# pane number display
set-option -g display-panes-active-colour "#989898"
set-option -g display-panes-colour "#2a2a2a"

# clock
set-window-option -g clock-mode-colour "#bd93f9"

# copy mode highlight
set-window-option -g mode-style "fg=#989898,bg=#2a2a2a"

# bell
set-window-option -g window-status-bell-style "fg=#1a1a1a,bg=#ff5555"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#ffffff,bg=#1a1a1a"

# style for command messages
set-option -g message-command-style "fg=#ffffff,bg=#2a2a2a"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#ffffff,bg=#1a1a1a"
  set-window-option -g window-style "fg=#ffffff,bg=#1a1a1a"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#ffffff,bg=#353535] #S #[fg=#353535,bg=#1a1a1a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2a2a2a,bg=#1a1a1a nobold, nounderscore, noitalics]#[fg=#989898,bg=#2a2a2a] %Y-%m-%d  %H:%M #[fg=#ffffff,bg=#2a2a2a,nobold,noitalics,nounderscore]#[fg=#1a1a1a,bg=#ffffff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1a1a1a,bg=#ffe4a3,nobold,noitalics,nounderscore]#[fg=#2a2a2a,bg=#ffe4a3] #I #[fg=#2a2a2a,bg=#ffe4a3,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#ffe4a3,bg=#1a1a1a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1a1a1a,bg=#2a2a2a,noitalics]#[fg=#ffffff,bg=#2a2a2a] #I #[fg=#ffffff,bg=#2a2a2a] #W#{?window_zoomed_flag,*Z,} #[fg=#2a2a2a,bg=#1a1a1a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
