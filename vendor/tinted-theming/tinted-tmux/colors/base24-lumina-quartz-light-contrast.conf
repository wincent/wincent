# Base24 Lumina Quartz Light Contrast
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#868687,bg=#f6f6f8"

# default window title colors
set-window-option -g window-status-style "fg=#868687,bg=#f6f6f8"

# active window title colors
set-window-option -g window-status-current-style "fg=#643800,bg=#f6f6f8"

# pane border
set-option -g pane-border-style "fg=#f6f6f8"
set-option -g pane-active-border-style "fg=#868687"

# message text
set-option -g message-style "fg=#474749,bg=#ebebec"

# pane number display
set-option -g display-panes-active-colour "#868687"
set-option -g display-panes-colour "#f6f6f8"

# clock
set-window-option -g clock-mode-colour "#004b7a"

# copy mode highlight
set-window-option -g mode-style "fg=#868687,bg=#ebebec"

# bell
set-window-option -g window-status-bell-style "fg=#fdfdfe,bg=#660005"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#0e0f13,bg=#f6f6f8"

# style for command messages
set-option -g message-command-style "fg=#474749,bg=#ebebec"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#0e0f13,bg=#fdfdfe"
  set-window-option -g window-style "fg=#0e0f13,bg=#f6f6f8"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#0e0f13,bg=#dadadc] #S #[fg=#dadadc,bg=#f6f6f8,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#ebebec,bg=#f6f6f8 nobold, nounderscore, noitalics]#[fg=#868687,bg=#ebebec] %Y-%m-%d  %H:%M #[fg=#0e0f13,bg=#ebebec,nobold,noitalics,nounderscore]#[fg=#f6f6f8,bg=#0e0f13] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f6f6f8,bg=#7e4800,nobold,noitalics,nounderscore]#[fg=#ebebec,bg=#7e4800] #I #[fg=#ebebec,bg=#7e4800,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#7e4800,bg=#f6f6f8,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f6f6f8,bg=#ebebec,noitalics]#[fg=#474749,bg=#ebebec] #I #[fg=#474749,bg=#ebebec] #W#{?window_zoomed_flag,*Z,}} #[fg=#ebebec,bg=#f6f6f8,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
