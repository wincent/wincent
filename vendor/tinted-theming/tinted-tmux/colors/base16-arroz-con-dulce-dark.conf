# Base16 Arroz con Dulce Dark
# Scheme author: Richard Martinez
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#f2dfc0,bg=#21140f"

# default window title colors
set-window-option -g window-status-style "fg=#f2dfc0,bg=#21140f"

# active window title colors
set-window-option -g window-status-current-style "fg=#d9a441,bg=#21140f"

# pane border
set-option -g pane-border-style "fg=#2c1a13"
set-option -g pane-active-border-style "fg=#c8a77a"

# message text
set-option -g message-style "fg=#f8ebd3,bg=#2c1a13"

# pane number display
set-option -g display-panes-active-colour "#c8a77a"
set-option -g display-panes-colour "#2c1a13"

# clock
set-window-option -g clock-mode-colour "#b99ac8"

# copy mode highlight
set-window-option -g mode-style "fg=#c8a77a,bg=#2c1a13"

# bell
set-window-option -g window-status-bell-style "fg=#21140f,bg=#e07a8a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f2dfc0,bg=#21140f"

# style for command messages
set-option -g message-command-style "fg=#f8ebd3,bg=#2c1a13"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f2dfc0,bg=#21140f"
  set-window-option -g window-style "fg=#f2dfc0,bg=#21140f"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f2dfc0,bg=#3b241a] #S #[fg=#3b241a,bg=#21140f,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2c1a13,bg=#21140f nobold, nounderscore, noitalics]#[fg=#c8a77a,bg=#2c1a13] %Y-%m-%d  %H:%M #[fg=#f2dfc0,bg=#2c1a13,nobold,noitalics,nounderscore]#[fg=#21140f,bg=#f2dfc0] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#21140f,bg=#d9a441,nobold,noitalics,nounderscore]#[fg=#2c1a13,bg=#d9a441] #I #[fg=#2c1a13,bg=#d9a441,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#d9a441,bg=#21140f,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#21140f,bg=#2c1a13,noitalics]#[fg=#f8ebd3,bg=#2c1a13] #I #[fg=#f8ebd3,bg=#2c1a13] #W#{?window_zoomed_flag,*Z,} #[fg=#2c1a13,bg=#21140f,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
