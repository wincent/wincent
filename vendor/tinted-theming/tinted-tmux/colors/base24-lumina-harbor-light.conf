# Base24 Lumina Harbor Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8d857a,bg=#f6eee1"

# default window title colors
set-window-option -g window-status-style "fg=#8d857a,bg=#f6eee1"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#f6eee1"

# pane border
set-option -g pane-border-style "fg=#f6eee1"
set-option -g pane-active-border-style "fg=#8d857a"

# message text
set-option -g message-style "fg=#4d473c,bg=#ebe2d6"

# pane number display
set-option -g display-panes-active-colour "#8d857a"
set-option -g display-panes-colour "#f6eee1"

# clock
set-window-option -g clock-mode-colour "#0468a4"

# copy mode highlight
set-window-option -g mode-style "fg=#8d857a,bg=#ebe2d6"

# bell
set-window-option -g window-status-bell-style "fg=#fbf5ec,bg=#8c1c1d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1c2d4f,bg=#f6eee1"

# style for command messages
set-option -g message-command-style "fg=#4d473c,bg=#ebe2d6"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1c2d4f,bg=#fbf5ec"
  set-window-option -g window-style "fg=#1c2d4f,bg=#f6eee1"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1c2d4f,bg=#dad2c6] #S #[fg=#dad2c6,bg=#f6eee1,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#ebe2d6,bg=#f6eee1 nobold, nounderscore, noitalics]#[fg=#8d857a,bg=#ebe2d6] %Y-%m-%d  %H:%M #[fg=#1c2d4f,bg=#ebe2d6,nobold,noitalics,nounderscore]#[fg=#f6eee1,bg=#1c2d4f] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f6eee1,bg=#a25f06,nobold,noitalics,nounderscore]#[fg=#ebe2d6,bg=#a25f06] #I #[fg=#ebe2d6,bg=#a25f06,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a25f06,bg=#f6eee1,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f6eee1,bg=#ebe2d6,noitalics]#[fg=#4d473c,bg=#ebe2d6] #I #[fg=#4d473c,bg=#ebe2d6] #W#{?window_zoomed_flag,*Z,}} #[fg=#ebe2d6,bg=#f6eee1,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
