# Base16 Pastelón de Amarillos
# Scheme author: Richard Martinez (https://sonofmartinus.com)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#432c3b,bg=#fff4d6"

# default window title colors
set-window-option -g window-status-style "fg=#432c3b,bg=#fff4d6"

# active window title colors
set-window-option -g window-status-current-style "fg=#946400,bg=#fff4d6"

# pane border
set-option -g pane-border-style "fg=#f2d083"
set-option -g pane-active-border-style "fg=#684653"

# message text
set-option -g message-style "fg=#2f1c2e,bg=#f2d083"

# pane number display
set-option -g display-panes-active-colour "#684653"
set-option -g display-panes-colour "#f2d083"

# clock
set-window-option -g clock-mode-colour "#1e5da8"

# copy mode highlight
set-window-option -g mode-style "fg=#684653,bg=#f2d083"

# bell
set-window-option -g window-status-bell-style "fg=#fff4d6,bg=#bd3548"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#432c3b,bg=#fff4d6"

# style for command messages
set-option -g message-command-style "fg=#2f1c2e,bg=#f2d083"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#432c3b,bg=#fff4d6"
  set-window-option -g window-style "fg=#432c3b,bg=#fff4d6"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#432c3b,bg=#d69b45] #S #[fg=#d69b45,bg=#fff4d6,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#f2d083,bg=#fff4d6 nobold, nounderscore, noitalics]#[fg=#684653,bg=#f2d083] %Y-%m-%d  %H:%M #[fg=#432c3b,bg=#f2d083,nobold,noitalics,nounderscore]#[fg=#fff4d6,bg=#432c3b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#fff4d6,bg=#946400,nobold,noitalics,nounderscore]#[fg=#f2d083,bg=#946400] #I #[fg=#f2d083,bg=#946400,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#946400,bg=#fff4d6,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#fff4d6,bg=#f2d083,noitalics]#[fg=#2f1c2e,bg=#f2d083] #I #[fg=#2f1c2e,bg=#f2d083] #W#{?window_zoomed_flag,*Z,} #[fg=#f2d083,bg=#fff4d6,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
