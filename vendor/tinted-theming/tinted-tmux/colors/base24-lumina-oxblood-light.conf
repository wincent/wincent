# Base24 Lumina Oxblood Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#918284,bg=#fbeaed"

# default window title colors
set-window-option -g window-status-style "fg=#918284,bg=#fbeaed"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#fbeaed"

# pane border
set-option -g pane-border-style "fg=#fbeaed"
set-option -g pane-active-border-style "fg=#918284"

# message text
set-option -g message-style "fg=#514446,bg=#efdee1"

# pane number display
set-option -g display-panes-active-colour "#918284"
set-option -g display-panes-colour "#fbeaed"

# clock
set-window-option -g clock-mode-colour "#3166a6"

# copy mode highlight
set-window-option -g mode-style "fg=#918284,bg=#efdee1"

# bell
set-window-option -g window-status-bell-style "fg=#fef2f4,bg=#9b2827"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#42222f,bg=#fbeaed"

# style for command messages
set-option -g message-command-style "fg=#514446,bg=#efdee1"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#42222f,bg=#fef2f4"
  set-window-option -g window-style "fg=#42222f,bg=#fbeaed"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#42222f,bg=#deced1] #S #[fg=#deced1,bg=#fbeaed,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#efdee1,bg=#fbeaed nobold, nounderscore, noitalics]#[fg=#918284,bg=#efdee1] %Y-%m-%d  %H:%M #[fg=#42222f,bg=#efdee1,nobold,noitalics,nounderscore]#[fg=#fbeaed,bg=#42222f] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#fbeaed,bg=#a1600a,nobold,noitalics,nounderscore]#[fg=#efdee1,bg=#a1600a] #I #[fg=#efdee1,bg=#a1600a,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a1600a,bg=#fbeaed,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#fbeaed,bg=#efdee1,noitalics]#[fg=#514446,bg=#efdee1] #I #[fg=#514446,bg=#efdee1] #W#{?window_zoomed_flag,*Z,}} #[fg=#efdee1,bg=#fbeaed,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
