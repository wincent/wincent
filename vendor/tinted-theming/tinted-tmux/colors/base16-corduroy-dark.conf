# Base16 Corduroy Dark
# Scheme author: taysatte (https://github.com/taysatte)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#ddd8df,bg=#141016"

# default window title colors
set-window-option -g window-status-style "fg=#ddd8df,bg=#141016"

# active window title colors
set-window-option -g window-status-current-style "fg=#f0bd9c,bg=#141016"

# pane border
set-option -g pane-border-style "fg=#1b151e"
set-option -g pane-active-border-style "fg=#9a8d9e"

# message text
set-option -g message-style "fg=#ddd8df,bg=#1b151e"

# pane number display
set-option -g display-panes-active-colour "#9a8d9e"
set-option -g display-panes-colour "#1b151e"

# clock
set-window-option -g clock-mode-colour "#dc92a3"

# copy mode highlight
set-window-option -g mode-style "fg=#9a8d9e,bg=#1b151e"

# bell
set-window-option -g window-status-bell-style "fg=#141016,bg=#e8758a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#ddd8df,bg=#141016"

# style for command messages
set-option -g message-command-style "fg=#ddd8df,bg=#1b151e"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#ddd8df,bg=#141016"
  set-window-option -g window-style "fg=#ddd8df,bg=#141016"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#ddd8df,bg=#221a26] #S #[fg=#221a26,bg=#141016,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#1b151e,bg=#141016 nobold, nounderscore, noitalics]#[fg=#9a8d9e,bg=#1b151e] %Y-%m-%d  %H:%M #[fg=#ddd8df,bg=#1b151e,nobold,noitalics,nounderscore]#[fg=#141016,bg=#ddd8df] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#141016,bg=#f0bd9c,nobold,noitalics,nounderscore]#[fg=#1b151e,bg=#f0bd9c] #I #[fg=#1b151e,bg=#f0bd9c,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#f0bd9c,bg=#141016,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#141016,bg=#1b151e,noitalics]#[fg=#ddd8df,bg=#1b151e] #I #[fg=#ddd8df,bg=#1b151e] #W#{?window_zoomed_flag,*Z,} #[fg=#1b151e,bg=#141016,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
