# Base16 Helsinki
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#544d40,bg=#f8fafe"

# default window title colors
set-window-option -g window-status-style "fg=#544d40,bg=#f8fafe"

# active window title colors
set-window-option -g window-status-current-style "fg=#2e70ad,bg=#f8fafe"

# pane border
set-option -g pane-border-style "fg=#edeef1"
set-option -g pane-active-border-style "fg=#8d8a82"

# message text
set-option -g message-style "fg=#3b362d,bg=#edeef1"

# pane number display
set-option -g display-panes-active-colour "#8d8a82"
set-option -g display-panes-colour "#edeef1"

# clock
set-window-option -g clock-mode-colour "#b55a0f"

# copy mode highlight
set-window-option -g mode-style "fg=#8d8a82,bg=#edeef1"

# bell
set-window-option -g window-status-bell-style "fg=#f8fafe,bg=#1faa9e"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#544d40,bg=#f8fafe"

# style for command messages
set-option -g message-command-style "fg=#3b362d,bg=#edeef1"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#544d40,bg=#f8fafe"
  set-window-option -g window-style "fg=#544d40,bg=#f8fafe"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#544d40,bg=#e4e5e7] #S #[fg=#e4e5e7,bg=#f8fafe,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#edeef1,bg=#f8fafe nobold, nounderscore, noitalics]#[fg=#8d8a82,bg=#edeef1] %Y-%m-%d  %H:%M #[fg=#544d40,bg=#edeef1,nobold,noitalics,nounderscore]#[fg=#f8fafe,bg=#544d40] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f8fafe,bg=#2e70ad,nobold,noitalics,nounderscore]#[fg=#edeef1,bg=#2e70ad] #I #[fg=#edeef1,bg=#2e70ad,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#2e70ad,bg=#f8fafe,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f8fafe,bg=#edeef1,noitalics]#[fg=#3b362d,bg=#edeef1] #I #[fg=#3b362d,bg=#edeef1] #W#{?window_zoomed_flag,*Z,} #[fg=#edeef1,bg=#f8fafe,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
