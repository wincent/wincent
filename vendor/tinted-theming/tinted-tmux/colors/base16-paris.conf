# Base16 Paris
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#f7f1ff,bg=#1a0a30"

# default window title colors
set-window-option -g window-status-style "fg=#f7f1ff,bg=#1a0a30"

# active window title colors
set-window-option -g window-status-current-style "fg=#fce566,bg=#1a0a30"

# pane border
set-option -g pane-border-style "fg=#291a3e"
set-option -g pane-active-border-style "fg=#9489a2"

# message text
set-option -g message-style "fg=#f9f4ff,bg=#291a3e"

# pane number display
set-option -g display-panes-active-colour "#9489a2"
set-option -g display-panes-colour "#291a3e"

# clock
set-window-option -g clock-mode-colour "#a3f3ff"

# copy mode highlight
set-window-option -g mode-style "fg=#9489a2,bg=#291a3e"

# bell
set-window-option -g window-status-bell-style "fg=#1a0a30,bg=#fc618d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f7f1ff,bg=#1a0a30"

# style for command messages
set-option -g message-command-style "fg=#f9f4ff,bg=#291a3e"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f7f1ff,bg=#1a0a30"
  set-window-option -g window-style "fg=#f7f1ff,bg=#1a0a30"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f7f1ff,bg=#352649] #S #[fg=#352649,bg=#1a0a30,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#291a3e,bg=#1a0a30 nobold, nounderscore, noitalics]#[fg=#9489a2,bg=#291a3e] %Y-%m-%d  %H:%M #[fg=#f7f1ff,bg=#291a3e,nobold,noitalics,nounderscore]#[fg=#1a0a30,bg=#f7f1ff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#1a0a30,bg=#fce566,nobold,noitalics,nounderscore]#[fg=#291a3e,bg=#fce566] #I #[fg=#291a3e,bg=#fce566,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#fce566,bg=#1a0a30,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#1a0a30,bg=#291a3e,noitalics]#[fg=#f9f4ff,bg=#291a3e] #I #[fg=#f9f4ff,bg=#291a3e] #W#{?window_zoomed_flag,*Z,} #[fg=#291a3e,bg=#1a0a30,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
