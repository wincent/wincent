# Base24 Cerulean Signal Dark
# Scheme author: Aaron Colichia (https://aaron.colichia.org/)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#aab8ca,bg=#131c29"

# default window title colors
set-window-option -g window-status-style "fg=#aab8ca,bg=#131c29"

# active window title colors
set-window-option -g window-status-current-style "fg=#f4dc76,bg=#131c29"

# pane border
set-option -g pane-border-style "fg=#131c29"
set-option -g pane-active-border-style "fg=#aab8ca"

# message text
set-option -g message-style "fg=#f1f6fc,bg=#173a5a"

# pane number display
set-option -g display-panes-active-colour "#aab8ca"
set-option -g display-panes-colour "#131c29"

# clock
set-window-option -g clock-mode-colour "#7dd3ff"

# copy mode highlight
set-window-option -g mode-style "fg=#aab8ca,bg=#173a5a"

# bell
set-window-option -g window-status-bell-style "fg=#101722,bg=#ff8a9a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#dce6f2,bg=#131c29"

# style for command messages
set-option -g message-command-style "fg=#f1f6fc,bg=#173a5a"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#dce6f2,bg=#101722"
  set-window-option -g window-style "fg=#dce6f2,bg=#131c29"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#dce6f2,bg=#8fa0b5] #S #[fg=#8fa0b5,bg=#131c29,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#173a5a,bg=#131c29 nobold, nounderscore, noitalics]#[fg=#aab8ca,bg=#173a5a] %Y-%m-%d  %H:%M #[fg=#dce6f2,bg=#173a5a,nobold,noitalics,nounderscore]#[fg=#131c29,bg=#dce6f2] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#131c29,bg=#e2c85f,nobold,noitalics,nounderscore]#[fg=#173a5a,bg=#e2c85f] #I #[fg=#173a5a,bg=#e2c85f,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#e2c85f,bg=#131c29,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#131c29,bg=#173a5a,noitalics]#[fg=#f1f6fc,bg=#173a5a] #I #[fg=#f1f6fc,bg=#173a5a] #W#{?window_zoomed_flag,*Z,}} #[fg=#173a5a,bg=#131c29,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
