# Base24 Pastelón de Amarillos Dark
# Scheme author: Richard Martinez (https://sonofmartinus.com)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#c39a89,bg=#2a1424"

# default window title colors
set-window-option -g window-status-style "fg=#c39a89,bg=#2a1424"

# active window title colors
set-window-option -g window-status-current-style "fg=#43d98d,bg=#2a1424"

# pane border
set-option -g pane-border-style "fg=#2a1424"
set-option -g pane-active-border-style "fg=#c39a89"

# message text
set-option -g message-style "fg=#ffebc5,bg=#432031"

# pane number display
set-option -g display-panes-active-colour "#c39a89"
set-option -g display-panes-colour "#2a1424"

# clock
set-window-option -g clock-mode-colour "#4c84bd"

# copy mode highlight
set-window-option -g mode-style "fg=#c39a89,bg=#432031"

# bell
set-window-option -g window-status-bell-style "fg=#180d18,bg=#d95361"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#ffe0a3,bg=#2a1424"

# style for command messages
set-option -g message-command-style "fg=#ffebc5,bg=#432031"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#ffe0a3,bg=#180d18"
  set-window-option -g window-style "fg=#ffe0a3,bg=#2a1424"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#ffe0a3,bg=#a0747c] #S #[fg=#a0747c,bg=#2a1424,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#432031,bg=#2a1424 nobold, nounderscore, noitalics]#[fg=#c39a89,bg=#432031] %Y-%m-%d  %H:%M #[fg=#ffe0a3,bg=#432031,nobold,noitalics,nounderscore]#[fg=#2a1424,bg=#ffe0a3] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#2a1424,bg=#d8a93a,nobold,noitalics,nounderscore]#[fg=#432031,bg=#d8a93a] #I #[fg=#432031,bg=#d8a93a,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#d8a93a,bg=#2a1424,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#2a1424,bg=#432031,noitalics]#[fg=#ffebc5,bg=#432031] #I #[fg=#ffebc5,bg=#432031] #W#{?window_zoomed_flag,*Z,}} #[fg=#432031,bg=#2a1424,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
