# Base24 Cerulean Signal Light
# Scheme author: Aaron Colichia (https://aaron.colichia.org/)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#566579,bg=#eef4fb"

# default window title colors
set-window-option -g window-status-style "fg=#566579,bg=#eef4fb"

# active window title colors
set-window-option -g window-status-current-style "fg=#7b6500,bg=#eef4fb"

# pane border
set-option -g pane-border-style "fg=#eef4fb"
set-option -g pane-active-border-style "fg=#566579"

# message text
set-option -g message-style "fg=#202b3a,bg=#dde7f1"

# pane number display
set-option -g display-panes-active-colour "#566579"
set-option -g display-panes-colour "#eef4fb"

# clock
set-window-option -g clock-mode-colour "#006fa8"

# copy mode highlight
set-window-option -g mode-style "fg=#566579,bg=#dde7f1"

# bell
set-window-option -g window-status-bell-style "fg=#f7f9fc,bg=#b4233d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#232b38,bg=#eef4fb"

# style for command messages
set-option -g message-command-style "fg=#202b3a,bg=#dde7f1"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#232b38,bg=#f7f9fc"
  set-window-option -g window-style "fg=#232b38,bg=#eef4fb"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#232b38,bg=#637287] #S #[fg=#637287,bg=#eef4fb,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#dde7f1,bg=#eef4fb nobold, nounderscore, noitalics]#[fg=#566579,bg=#dde7f1] %Y-%m-%d  %H:%M #[fg=#232b38,bg=#dde7f1,nobold,noitalics,nounderscore]#[fg=#eef4fb,bg=#232b38] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#eef4fb,bg=#6f6300,nobold,noitalics,nounderscore]#[fg=#dde7f1,bg=#6f6300] #I #[fg=#dde7f1,bg=#6f6300,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#6f6300,bg=#eef4fb,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#eef4fb,bg=#dde7f1,noitalics]#[fg=#202b3a,bg=#dde7f1] #I #[fg=#202b3a,bg=#dde7f1] #W#{?window_zoomed_flag,*Z,}} #[fg=#dde7f1,bg=#eef4fb,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
