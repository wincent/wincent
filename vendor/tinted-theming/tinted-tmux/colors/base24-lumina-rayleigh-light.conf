# Base24 Lumina Rayleigh Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#7b8891,bg=#e3f2fb"

# default window title colors
set-window-option -g window-status-style "fg=#7b8891,bg=#e3f2fb"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#e3f2fb"

# pane border
set-option -g pane-border-style "fg=#e3f2fb"
set-option -g pane-active-border-style "fg=#7b8891"

# message text
set-option -g message-style "fg=#3d4a52,bg=#d8e6f0"

# pane number display
set-option -g display-panes-active-colour "#7b8891"
set-option -g display-panes-colour "#e3f2fb"

# clock
set-window-option -g clock-mode-colour "#0160a7"

# copy mode highlight
set-window-option -g mode-style "fg=#7b8891,bg=#d8e6f0"

# bell
set-window-option -g window-status-bell-style "fg=#edf8ff,bg=#94171b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#1d2f47,bg=#e3f2fb"

# style for command messages
set-option -g message-command-style "fg=#3d4a52,bg=#d8e6f0"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#1d2f47,bg=#edf8ff"
  set-window-option -g window-style "fg=#1d2f47,bg=#e3f2fb"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#1d2f47,bg=#c8d6df] #S #[fg=#c8d6df,bg=#e3f2fb,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#d8e6f0,bg=#e3f2fb nobold, nounderscore, noitalics]#[fg=#7b8891,bg=#d8e6f0] %Y-%m-%d  %H:%M #[fg=#1d2f47,bg=#d8e6f0,nobold,noitalics,nounderscore]#[fg=#e3f2fb,bg=#1d2f47] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e3f2fb,bg=#a35f00,nobold,noitalics,nounderscore]#[fg=#d8e6f0,bg=#a35f00] #I #[fg=#d8e6f0,bg=#a35f00,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a35f00,bg=#e3f2fb,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e3f2fb,bg=#d8e6f0,noitalics]#[fg=#3d4a52,bg=#d8e6f0] #I #[fg=#3d4a52,bg=#d8e6f0] #W#{?window_zoomed_flag,*Z,}} #[fg=#d8e6f0,bg=#e3f2fb,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
