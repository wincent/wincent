# Base24 Lumina Canopy Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#5b6f5f,bg=#0f2014"

# default window title colors
set-window-option -g window-status-style "fg=#5b6f5f,bg=#0f2014"

# active window title colors
set-window-option -g window-status-current-style "fg=#f4e792,bg=#0f2014"

# pane border
set-option -g pane-border-style "fg=#0f2014"
set-option -g pane-active-border-style "fg=#5b6f5f"

# message text
set-option -g message-style "fg=#a8b5aa,bg=#192a1d"

# pane number display
set-option -g display-panes-active-colour "#5b6f5f"
set-option -g display-panes-colour "#0f2014"

# clock
set-window-option -g clock-mode-colour "#9acaf1"

# copy mode highlight
set-window-option -g mode-style "fg=#5b6f5f,bg=#192a1d"

# bell
set-window-option -g window-status-bell-style "fg=#0c1b10,bg=#d57068"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d8e3d6,bg=#0f2014"

# style for command messages
set-option -g message-command-style "fg=#a8b5aa,bg=#192a1d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#d8e3d6,bg=#0c1b10"
  set-window-option -g window-style "fg=#d8e3d6,bg=#0f2014"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#d8e3d6,bg=#223427] #S #[fg=#223427,bg=#0f2014,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#192a1d,bg=#0f2014 nobold, nounderscore, noitalics]#[fg=#5b6f5f,bg=#192a1d] %Y-%m-%d  %H:%M #[fg=#d8e3d6,bg=#192a1d,nobold,noitalics,nounderscore]#[fg=#0f2014,bg=#d8e3d6] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#0f2014,bg=#d1cca8,nobold,noitalics,nounderscore]#[fg=#192a1d,bg=#d1cca8] #I #[fg=#192a1d,bg=#d1cca8,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#d1cca8,bg=#0f2014,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#0f2014,bg=#192a1d,noitalics]#[fg=#a8b5aa,bg=#192a1d] #I #[fg=#a8b5aa,bg=#192a1d] #W#{?window_zoomed_flag,*Z,}} #[fg=#192a1d,bg=#0f2014,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
