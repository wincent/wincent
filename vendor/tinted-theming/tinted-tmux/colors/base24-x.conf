# Base24 X
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8a878e,bg=#161616"

# default window title colors
set-window-option -g window-status-style "fg=#8a878e,bg=#161616"

# active window title colors
set-window-option -g window-status-current-style "fg=#fce566,bg=#161616"

# pane border
set-option -g pane-border-style "fg=#161616"
set-option -g pane-active-border-style "fg=#8a878e"

# message text
set-option -g message-style "fg=#f9f4ff,bg=#222123"

# pane number display
set-option -g display-panes-active-colour "#8a878e"
set-option -g display-panes-colour "#161616"

# clock
set-window-option -g clock-mode-colour "#fd9353"

# copy mode highlight
set-window-option -g mode-style "fg=#8a878e,bg=#222123"

# bell
set-window-option -g window-status-bell-style "fg=#050505,bg=#fc618d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f7f1ff,bg=#161616"

# style for command messages
set-option -g message-command-style "fg=#f9f4ff,bg=#222123"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f7f1ff,bg=#050505"
  set-window-option -g window-style "fg=#f7f1ff,bg=#161616"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f7f1ff,bg=#6b686e] #S #[fg=#6b686e,bg=#161616,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#222123,bg=#161616 nobold, nounderscore, noitalics]#[fg=#8a878e,bg=#222123] %Y-%m-%d  %H:%M #[fg=#f7f1ff,bg=#222123,nobold,noitalics,nounderscore]#[fg=#161616,bg=#f7f1ff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#161616,bg=#fce566,nobold,noitalics,nounderscore]#[fg=#222123,bg=#fce566] #I #[fg=#222123,bg=#fce566,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#fce566,bg=#161616,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#161616,bg=#222123,noitalics]#[fg=#f9f4ff,bg=#222123] #I #[fg=#f9f4ff,bg=#222123] #W#{?window_zoomed_flag,*Z,}} #[fg=#222123,bg=#161616,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
