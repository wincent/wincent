# Base24 Lumina Espresso Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#74675d,bg=#231911"

# default window title colors
set-window-option -g window-status-style "fg=#74675d,bg=#231911"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b4,bg=#231911"

# pane border
set-option -g pane-border-style "fg=#231911"
set-option -g pane-active-border-style "fg=#74675d"

# message text
set-option -g message-style "fg=#b8afa9,bg=#2d231b"

# pane number display
set-option -g display-panes-active-colour "#74675d"
set-option -g display-panes-colour "#231911"

# clock
set-window-option -g clock-mode-colour "#96bfe9"

# copy mode highlight
set-window-option -g mode-style "fg=#74675d,bg=#2d231b"

# bell
set-window-option -g window-status-bell-style "fg=#1e150e,bg=#cd766e"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#e5dfd6,bg=#231911"

# style for command messages
set-option -g message-command-style "fg=#b8afa9,bg=#2d231b"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#e5dfd6,bg=#1e150e"
  set-window-option -g window-style "fg=#e5dfd6,bg=#231911"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#e5dfd6,bg=#382d24] #S #[fg=#382d24,bg=#231911,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2d231b,bg=#231911 nobold, nounderscore, noitalics]#[fg=#74675d,bg=#2d231b] %Y-%m-%d  %H:%M #[fg=#e5dfd6,bg=#2d231b,nobold,noitalics,nounderscore]#[fg=#231911,bg=#e5dfd6] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#231911,bg=#efca86,nobold,noitalics,nounderscore]#[fg=#2d231b,bg=#efca86] #I #[fg=#2d231b,bg=#efca86,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#efca86,bg=#231911,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#231911,bg=#2d231b,noitalics]#[fg=#b8afa9,bg=#2d231b] #I #[fg=#b8afa9,bg=#2d231b] #W#{?window_zoomed_flag,*Z,}} #[fg=#2d231b,bg=#231911,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
