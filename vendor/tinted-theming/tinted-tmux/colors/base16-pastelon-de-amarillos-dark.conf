# Base16 Pastelón de Amarillos Dark
# Scheme author: Richard Martinez (https://sonofmartinus.com)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#ffe0a3,bg=#180d18"

# default window title colors
set-window-option -g window-status-style "fg=#ffe0a3,bg=#180d18"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffc84a,bg=#180d18"

# pane border
set-option -g pane-border-style "fg=#2a1424"
set-option -g pane-active-border-style "fg=#c39a89"

# message text
set-option -g message-style "fg=#ffebc5,bg=#2a1424"

# pane number display
set-option -g display-panes-active-colour "#c39a89"
set-option -g display-panes-colour "#2a1424"

# clock
set-window-option -g clock-mode-colour "#5a9fe6"

# copy mode highlight
set-window-option -g mode-style "fg=#c39a89,bg=#2a1424"

# bell
set-window-option -g window-status-bell-style "fg=#180d18,bg=#ff646a"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#ffe0a3,bg=#180d18"

# style for command messages
set-option -g message-command-style "fg=#ffebc5,bg=#2a1424"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#ffe0a3,bg=#180d18"
  set-window-option -g window-style "fg=#ffe0a3,bg=#180d18"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#ffe0a3,bg=#432031] #S #[fg=#432031,bg=#180d18,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#2a1424,bg=#180d18 nobold, nounderscore, noitalics]#[fg=#c39a89,bg=#2a1424] %Y-%m-%d  %H:%M #[fg=#ffe0a3,bg=#2a1424,nobold,noitalics,nounderscore]#[fg=#180d18,bg=#ffe0a3] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#180d18,bg=#ffc84a,nobold,noitalics,nounderscore]#[fg=#2a1424,bg=#ffc84a] #I #[fg=#2a1424,bg=#ffc84a,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#ffc84a,bg=#180d18,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#180d18,bg=#2a1424,noitalics]#[fg=#ffebc5,bg=#2a1424] #I #[fg=#ffebc5,bg=#2a1424] #W#{?window_zoomed_flag,*Z,} #[fg=#2a1424,bg=#180d18,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
