# Base24 Lumina Dusk Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#878491,bg=#f0ecfa"

# default window title colors
set-window-option -g window-status-style "fg=#878491,bg=#f0ecfa"

# active window title colors
set-window-option -g window-status-current-style "fg=#854e07,bg=#f0ecfa"

# pane border
set-option -g pane-border-style "fg=#f0ecfa"
set-option -g pane-active-border-style "fg=#878491"

# message text
set-option -g message-style "fg=#494552,bg=#e4e0ef"

# pane number display
set-option -g display-panes-active-colour "#878491"
set-option -g display-panes-colour "#f0ecfa"

# clock
set-window-option -g clock-mode-colour "#3163ad"

# copy mode highlight
set-window-option -g mode-style "fg=#878491,bg=#e4e0ef"

# bell
set-window-option -g window-status-bell-style "fg=#f6f3fe,bg=#872423"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#2e2945,bg=#f0ecfa"

# style for command messages
set-option -g message-command-style "fg=#494552,bg=#e4e0ef"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#2e2945,bg=#f6f3fe"
  set-window-option -g window-style "fg=#2e2945,bg=#f0ecfa"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#2e2945,bg=#d4d0de] #S #[fg=#d4d0de,bg=#f0ecfa,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e4e0ef,bg=#f0ecfa nobold, nounderscore, noitalics]#[fg=#878491,bg=#e4e0ef] %Y-%m-%d  %H:%M #[fg=#2e2945,bg=#e4e0ef,nobold,noitalics,nounderscore]#[fg=#f0ecfa,bg=#2e2945] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f0ecfa,bg=#9e611b,nobold,noitalics,nounderscore]#[fg=#e4e0ef,bg=#9e611b] #I #[fg=#e4e0ef,bg=#9e611b,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9e611b,bg=#f0ecfa,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f0ecfa,bg=#e4e0ef,noitalics]#[fg=#494552,bg=#e4e0ef] #I #[fg=#494552,bg=#e4e0ef] #W#{?window_zoomed_flag,*Z,}} #[fg=#e4e0ef,bg=#f0ecfa,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
