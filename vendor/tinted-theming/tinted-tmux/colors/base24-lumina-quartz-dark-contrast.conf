# Base24 Lumina Quartz Dark Contrast
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#68696a,bg=#111213"

# default window title colors
set-window-option -g window-status-style "fg=#68696a,bg=#111213"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe4b0,bg=#111213"

# pane border
set-option -g pane-border-style "fg=#111213"
set-option -g pane-active-border-style "fg=#68696a"

# message text
set-option -g message-style "fg=#b0b1b2,bg=#1a1b1d"

# pane number display
set-option -g display-panes-active-colour "#68696a"
set-option -g display-panes-colour "#111213"

# clock
set-window-option -g clock-mode-colour "#7fb7ff"

# copy mode highlight
set-window-option -g mode-style "fg=#68696a,bg=#1a1b1d"

# bell
set-window-option -g window-status-bell-style "fg=#0d0e0f,bg=#ffa69b"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#ebeff2,bg=#111213"

# style for command messages
set-option -g message-command-style "fg=#b0b1b2,bg=#1a1b1d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#ebeff2,bg=#0d0e0f"
  set-window-option -g window-style "fg=#ebeff2,bg=#111213"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#ebeff2,bg=#242526] #S #[fg=#242526,bg=#111213,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#1a1b1d,bg=#111213 nobold, nounderscore, noitalics]#[fg=#68696a,bg=#1a1b1d] %Y-%m-%d  %H:%M #[fg=#ebeff2,bg=#1a1b1d,nobold,noitalics,nounderscore]#[fg=#111213,bg=#ebeff2] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#111213,bg=#ffc334,nobold,noitalics,nounderscore]#[fg=#1a1b1d,bg=#ffc334] #I #[fg=#1a1b1d,bg=#ffc334,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#ffc334,bg=#111213,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#111213,bg=#1a1b1d,noitalics]#[fg=#b0b1b2,bg=#1a1b1d] #I #[fg=#b0b1b2,bg=#1a1b1d] #W#{?window_zoomed_flag,*Z,}} #[fg=#1a1b1d,bg=#111213,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
