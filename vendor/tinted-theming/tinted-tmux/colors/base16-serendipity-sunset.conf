# Base16 Serendipity Sunset
# Scheme author: Micheal Andreuzza (https://michaelandreuzza.com/)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#dee0ef,bg=#202231"

# default window title colors
set-window-option -g window-status-style "fg=#dee0ef,bg=#202231"

# active window title colors
set-window-option -g window-status-current-style "fg=#a392dc,bg=#202231"

# pane border
set-option -g pane-border-style "fg=#272938"
set-option -g pane-active-border-style "fg=#6b6d7c"

# message text
set-option -g message-style "fg=#dee0ef,bg=#272938"

# pane number display
set-option -g display-panes-active-colour "#6b6d7c"
set-option -g display-panes-colour "#272938"

# clock
set-window-option -g clock-mode-colour "#a0b6e8"

# copy mode highlight
set-window-option -g mode-style "fg=#6b6d7c,bg=#272938"

# bell
set-window-option -g window-status-bell-style "fg=#202231,bg=#d1918f"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#dee0ef,bg=#202231"

# style for command messages
set-option -g message-command-style "fg=#dee0ef,bg=#272938"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#dee0ef,bg=#202231"
  set-window-option -g window-style "fg=#dee0ef,bg=#202231"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#dee0ef,bg=#272938] #S #[fg=#272938,bg=#202231,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#272938,bg=#202231 nobold, nounderscore, noitalics]#[fg=#6b6d7c,bg=#272938] %Y-%m-%d  %H:%M #[fg=#dee0ef,bg=#272938,nobold,noitalics,nounderscore]#[fg=#202231,bg=#dee0ef] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#202231,bg=#a392dc,nobold,noitalics,nounderscore]#[fg=#272938,bg=#a392dc] #I #[fg=#272938,bg=#a392dc,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#a392dc,bg=#202231,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#202231,bg=#272938,noitalics]#[fg=#dee0ef,bg=#272938] #I #[fg=#dee0ef,bg=#272938] #W#{?window_zoomed_flag,*Z,} #[fg=#272938,bg=#202231,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
