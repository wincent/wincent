# Base24 Lumina Lagoon Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#758b8b,bg=#e1f4f4"

# default window title colors
set-window-option -g window-status-style "fg=#758b8b,bg=#e1f4f4"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e00,bg=#e1f4f4"

# pane border
set-option -g pane-border-style "fg=#e1f4f4"
set-option -g pane-active-border-style "fg=#758b8b"

# message text
set-option -g message-style "fg=#384c4c,bg=#d5e8e8"

# pane number display
set-option -g display-panes-active-colour "#758b8b"
set-option -g display-panes-colour "#e1f4f4"

# clock
set-window-option -g clock-mode-colour "#185ca9"

# copy mode highlight
set-window-option -g mode-style "fg=#758b8b,bg=#d5e8e8"

# bell
set-window-option -g window-status-bell-style "fg=#e9fafa,bg=#8f2121"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#0b323b,bg=#e1f4f4"

# style for command messages
set-option -g message-command-style "fg=#384c4c,bg=#d5e8e8"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#0b323b,bg=#e9fafa"
  set-window-option -g window-style "fg=#0b323b,bg=#e1f4f4"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#0b323b,bg=#c5d8d8] #S #[fg=#c5d8d8,bg=#e1f4f4,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#d5e8e8,bg=#e1f4f4 nobold, nounderscore, noitalics]#[fg=#758b8b,bg=#d5e8e8] %Y-%m-%d  %H:%M #[fg=#0b323b,bg=#d5e8e8,nobold,noitalics,nounderscore]#[fg=#e1f4f4,bg=#0b323b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e1f4f4,bg=#a1600d,nobold,noitalics,nounderscore]#[fg=#d5e8e8,bg=#a1600d] #I #[fg=#d5e8e8,bg=#a1600d,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a1600d,bg=#e1f4f4,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e1f4f4,bg=#d5e8e8,noitalics]#[fg=#384c4c,bg=#d5e8e8] #I #[fg=#384c4c,bg=#d5e8e8] #W#{?window_zoomed_flag,*Z,}} #[fg=#d5e8e8,bg=#e1f4f4,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
