# Base16 Sequoia Monochrome Light
# Scheme author: Micheal Andreuzza (https://michaelandreuzza.com/)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#282930,bg=#edeef2"

# default window title colors
set-window-option -g window-status-style "fg=#282930,bg=#edeef2"

# active window title colors
set-window-option -g window-status-current-style "fg=#50535e,bg=#edeef2"

# pane border
set-option -g pane-border-style "fg=#e2e3e8"
set-option -g pane-active-border-style "fg=#42434e"

# message text
set-option -g message-style "fg=#282930,bg=#e2e3e8"

# pane number display
set-option -g display-panes-active-colour "#42434e"
set-option -g display-panes-colour "#e2e3e8"

# clock
set-window-option -g clock-mode-colour "#5f6370"

# copy mode highlight
set-window-option -g mode-style "fg=#42434e,bg=#e2e3e8"

# bell
set-window-option -g window-status-bell-style "fg=#edeef2,bg=#525666"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#282930,bg=#edeef2"

# style for command messages
set-option -g message-command-style "fg=#282930,bg=#e2e3e8"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#282930,bg=#edeef2"
  set-window-option -g window-style "fg=#282930,bg=#edeef2"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#282930,bg=#e2e3e8] #S #[fg=#e2e3e8,bg=#edeef2,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e2e3e8,bg=#edeef2 nobold, nounderscore, noitalics]#[fg=#42434e,bg=#e2e3e8] %Y-%m-%d  %H:%M #[fg=#282930,bg=#e2e3e8,nobold,noitalics,nounderscore]#[fg=#edeef2,bg=#282930] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#edeef2,bg=#50535e,nobold,noitalics,nounderscore]#[fg=#e2e3e8,bg=#50535e] #I #[fg=#e2e3e8,bg=#50535e,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#50535e,bg=#edeef2,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#edeef2,bg=#e2e3e8,noitalics]#[fg=#282930,bg=#e2e3e8] #I #[fg=#282930,bg=#e2e3e8] #W#{?window_zoomed_flag,*Z,} #[fg=#e2e3e8,bg=#edeef2,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
