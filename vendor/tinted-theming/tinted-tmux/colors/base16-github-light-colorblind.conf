# Base16 Github Light Colorblind
# Scheme author: Tinted Theming (https://github.com/tinted-theming)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#454c54,bg=#ffffff"

# default window title colors
set-window-option -g window-status-style "fg=#454c54,bg=#ffffff"

# active window title colors
set-window-option -g window-status-current-style "fg=#9a6700,bg=#ffffff"

# pane border
set-option -g pane-border-style "fg=#f6f8fa"
set-option -g pane-active-border-style "fg=#59636e"

# message text
set-option -g message-style "fg=#25292e,bg=#f6f8fa"

# pane number display
set-option -g display-panes-active-colour "#59636e"
set-option -g display-panes-colour "#f6f8fa"

# clock
set-window-option -g clock-mode-colour "#0969da"

# copy mode highlight
set-window-option -g mode-style "fg=#59636e,bg=#f6f8fa"

# bell
set-window-option -g window-status-bell-style "fg=#ffffff,bg=#bc4c00"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#454c54,bg=#ffffff"

# style for command messages
set-option -g message-command-style "fg=#25292e,bg=#f6f8fa"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#454c54,bg=#ffffff"
  set-window-option -g window-style "fg=#454c54,bg=#ffffff"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#454c54,bg=#d1d9e0] #S #[fg=#d1d9e0,bg=#ffffff,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#f6f8fa,bg=#ffffff nobold, nounderscore, noitalics]#[fg=#59636e,bg=#f6f8fa] %Y-%m-%d  %H:%M #[fg=#454c54,bg=#f6f8fa,nobold,noitalics,nounderscore]#[fg=#ffffff,bg=#454c54] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#ffffff,bg=#9a6700,nobold,noitalics,nounderscore]#[fg=#f6f8fa,bg=#9a6700] #I #[fg=#f6f8fa,bg=#9a6700,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#9a6700,bg=#ffffff,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#ffffff,bg=#f6f8fa,noitalics]#[fg=#25292e,bg=#f6f8fa] #I #[fg=#25292e,bg=#f6f8fa] #W#{?window_zoomed_flag,*Z,} #[fg=#f6f8fa,bg=#ffffff,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
