# Base16 Arroz con Dulce
# Scheme author: Richard Martinez
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#4a2c20,bg=#fff8e7"

# default window title colors
set-window-option -g window-status-style "fg=#4a2c20,bg=#fff8e7"

# active window title colors
set-window-option -g window-status-current-style "fg=#855500,bg=#fff8e7"

# pane border
set-option -g pane-border-style "fg=#f7ebd3"
set-option -g pane-active-border-style "fg=#765b45"

# message text
set-option -g message-style "fg=#321c14,bg=#f7ebd3"

# pane number display
set-option -g display-panes-active-colour "#765b45"
set-option -g display-panes-colour "#f7ebd3"

# clock
set-window-option -g clock-mode-colour "#5940a0"

# copy mode highlight
set-window-option -g mode-style "fg=#765b45,bg=#f7ebd3"

# bell
set-window-option -g window-status-bell-style "fg=#fff8e7,bg=#a11d48"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#4a2c20,bg=#fff8e7"

# style for command messages
set-option -g message-command-style "fg=#321c14,bg=#f7ebd3"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#4a2c20,bg=#fff8e7"
  set-window-option -g window-style "fg=#4a2c20,bg=#fff8e7"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#4a2c20,bg=#ead6b8] #S #[fg=#ead6b8,bg=#fff8e7,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#f7ebd3,bg=#fff8e7 nobold, nounderscore, noitalics]#[fg=#765b45,bg=#f7ebd3] %Y-%m-%d  %H:%M #[fg=#4a2c20,bg=#f7ebd3,nobold,noitalics,nounderscore]#[fg=#fff8e7,bg=#4a2c20] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#fff8e7,bg=#855500,nobold,noitalics,nounderscore]#[fg=#f7ebd3,bg=#855500] #I #[fg=#f7ebd3,bg=#855500,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#855500,bg=#fff8e7,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#fff8e7,bg=#f7ebd3,noitalics]#[fg=#321c14,bg=#f7ebd3] #I #[fg=#321c14,bg=#f7ebd3] #W#{?window_zoomed_flag,*Z,} #[fg=#f7ebd3,bg=#fff8e7,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
