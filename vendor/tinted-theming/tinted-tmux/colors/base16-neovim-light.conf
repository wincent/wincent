# Base16 Neovim Light
# Scheme author: https://github.com/neovim/neovim/blob/master/src/nvim/highlight_group.c
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#14161b,bg=#e0e2ea"

# default window title colors
set-window-option -g window-status-style "fg=#14161b,bg=#e0e2ea"

# active window title colors
set-window-option -g window-status-current-style "fg=#6b5300,bg=#e0e2ea"

# pane border
set-option -g pane-border-style "fg=#eef1f8"
set-option -g pane-active-border-style "fg=#2c2e33"

# message text
set-option -g message-style "fg=#07080d,bg=#eef1f8"

# pane number display
set-option -g display-panes-active-colour "#2c2e33"
set-option -g display-panes-colour "#eef1f8"

# clock
set-window-option -g clock-mode-colour "#004c73"

# copy mode highlight
set-window-option -g mode-style "fg=#2c2e33,bg=#eef1f8"

# bell
set-window-option -g window-status-bell-style "fg=#e0e2ea,bg=#590008"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#14161b,bg=#e0e2ea"

# style for command messages
set-option -g message-command-style "fg=#07080d,bg=#eef1f8"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#14161b,bg=#e0e2ea"
  set-window-option -g window-style "fg=#14161b,bg=#e0e2ea"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#14161b,bg=#9b9ea4] #S #[fg=#9b9ea4,bg=#e0e2ea,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#eef1f8,bg=#e0e2ea nobold, nounderscore, noitalics]#[fg=#2c2e33,bg=#eef1f8] %Y-%m-%d  %H:%M #[fg=#14161b,bg=#eef1f8,nobold,noitalics,nounderscore]#[fg=#e0e2ea,bg=#14161b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#e0e2ea,bg=#6b5300,nobold,noitalics,nounderscore]#[fg=#eef1f8,bg=#6b5300] #I #[fg=#eef1f8,bg=#6b5300,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#6b5300,bg=#e0e2ea,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#e0e2ea,bg=#eef1f8,noitalics]#[fg=#07080d,bg=#eef1f8] #I #[fg=#07080d,bg=#eef1f8] #W#{?window_zoomed_flag,*Z,} #[fg=#eef1f8,bg=#e0e2ea,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
