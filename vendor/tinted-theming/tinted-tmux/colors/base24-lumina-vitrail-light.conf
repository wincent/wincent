# Base24 Lumina Vitrail Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#89867f,bg=#f6f3eb"

# default window title colors
set-window-option -g window-status-style "fg=#89867f,bg=#f6f3eb"

# active window title colors
set-window-option -g window-status-current-style "fg=#623700,bg=#f6f3eb"

# pane border
set-option -g pane-border-style "fg=#f6f3eb"
set-option -g pane-active-border-style "fg=#89867f"

# message text
set-option -g message-style "fg=#4a4841,bg=#eae8df"

# pane number display
set-option -g display-panes-active-colour "#89867f"
set-option -g display-panes-colour "#f6f3eb"

# clock
set-window-option -g clock-mode-colour "#1729b2"

# copy mode highlight
set-window-option -g mode-style "fg=#89867f,bg=#eae8df"

# bell
set-window-option -g window-status-bell-style "fg=#fcfaf4,bg=#752200"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#0f141d,bg=#f6f3eb"

# style for command messages
set-option -g message-command-style "fg=#4a4841,bg=#eae8df"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#0f141d,bg=#fcfaf4"
  set-window-option -g window-style "fg=#0f141d,bg=#f6f3eb"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#0f141d,bg=#dad7cf] #S #[fg=#dad7cf,bg=#f6f3eb,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#eae8df,bg=#f6f3eb nobold, nounderscore, noitalics]#[fg=#89867f,bg=#eae8df] %Y-%m-%d  %H:%M #[fg=#0f141d,bg=#eae8df,nobold,noitalics,nounderscore]#[fg=#f6f3eb,bg=#0f141d] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f6f3eb,bg=#7c4700,nobold,noitalics,nounderscore]#[fg=#eae8df,bg=#7c4700] #I #[fg=#eae8df,bg=#7c4700,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#7c4700,bg=#f6f3eb,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f6f3eb,bg=#eae8df,noitalics]#[fg=#4a4841,bg=#eae8df] #I #[fg=#4a4841,bg=#eae8df] #W#{?window_zoomed_flag,*Z,}} #[fg=#eae8df,bg=#f6f3eb,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
