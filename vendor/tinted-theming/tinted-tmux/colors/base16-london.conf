# Base16 London
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#333333,bg=#ffffff"

# default window title colors
set-window-option -g window-status-style "fg=#333333,bg=#ffffff"

# active window title colors
set-window-option -g window-status-current-style "fg=#555555,bg=#ffffff"

# pane border
set-option -g pane-border-style "fg=#f1f1f1"
set-option -g pane-active-border-style "fg=#7a7a7a"

# message text
set-option -g message-style "fg=#242424,bg=#f1f1f1"

# pane number display
set-option -g display-panes-active-colour "#7a7a7a"
set-option -g display-panes-colour "#f1f1f1"

# clock
set-window-option -g clock-mode-colour "#666666"

# copy mode highlight
set-window-option -g mode-style "fg=#7a7a7a,bg=#f1f1f1"

# bell
set-window-option -g window-status-bell-style "fg=#ffffff,bg=#333333"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#333333,bg=#ffffff"

# style for command messages
set-option -g message-command-style "fg=#242424,bg=#f1f1f1"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#333333,bg=#ffffff"
  set-window-option -g window-style "fg=#333333,bg=#ffffff"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#333333,bg=#e7e7e7] #S #[fg=#e7e7e7,bg=#ffffff,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#f1f1f1,bg=#ffffff nobold, nounderscore, noitalics]#[fg=#7a7a7a,bg=#f1f1f1] %Y-%m-%d  %H:%M #[fg=#333333,bg=#f1f1f1,nobold,noitalics,nounderscore]#[fg=#ffffff,bg=#333333] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#ffffff,bg=#555555,nobold,noitalics,nounderscore]#[fg=#f1f1f1,bg=#555555] #I #[fg=#f1f1f1,bg=#555555,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#555555,bg=#ffffff,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#ffffff,bg=#f1f1f1,noitalics]#[fg=#242424,bg=#f1f1f1] #I #[fg=#242424,bg=#f1f1f1] #W#{?window_zoomed_flag,*Z,} #[fg=#f1f1f1,bg=#ffffff,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
