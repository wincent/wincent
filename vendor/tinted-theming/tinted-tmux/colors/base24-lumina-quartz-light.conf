# Base24 Lumina Quartz Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#84868a,bg=#eef0f5"

# default window title colors
set-window-option -g window-status-style "fg=#84868a,bg=#eef0f5"

# active window title colors
set-window-option -g window-status-current-style "fg=#82511c,bg=#eef0f5"

# pane border
set-option -g pane-border-style "fg=#eef0f5"
set-option -g pane-active-border-style "fg=#84868a"

# message text
set-option -g message-style "fg=#46484b,bg=#e2e5e9"

# pane number display
set-option -g display-panes-active-colour "#84868a"
set-option -g display-panes-colour "#eef0f5"

# clock
set-window-option -g clock-mode-colour "#446894"

# copy mode highlight
set-window-option -g mode-style "fg=#84868a,bg=#e2e5e9"

# bell
set-window-option -g window-status-bell-style "fg=#f5f7fa,bg=#7d2b28"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#30353b,bg=#eef0f5"

# style for command messages
set-option -g message-command-style "fg=#46484b,bg=#e2e5e9"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#30353b,bg=#f5f7fa"
  set-window-option -g window-style "fg=#30353b,bg=#eef0f5"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#30353b,bg=#d2d4d9] #S #[fg=#d2d4d9,bg=#eef0f5,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e2e5e9,bg=#eef0f5 nobold, nounderscore, noitalics]#[fg=#84868a,bg=#e2e5e9] %Y-%m-%d  %H:%M #[fg=#30353b,bg=#e2e5e9,nobold,noitalics,nounderscore]#[fg=#eef0f5,bg=#30353b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#eef0f5,bg=#9a642c,nobold,noitalics,nounderscore]#[fg=#e2e5e9,bg=#9a642c] #I #[fg=#e2e5e9,bg=#9a642c,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#9a642c,bg=#eef0f5,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#eef0f5,bg=#e2e5e9,noitalics]#[fg=#46484b,bg=#e2e5e9] #I #[fg=#46484b,bg=#e2e5e9] #W#{?window_zoomed_flag,*Z,}} #[fg=#e2e5e9,bg=#eef0f5,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
