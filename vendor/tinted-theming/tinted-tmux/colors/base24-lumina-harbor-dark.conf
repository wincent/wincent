# Base24 Lumina Harbor Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#62697a,bg=#111523"

# default window title colors
set-window-option -g window-status-style "fg=#62697a,bg=#111523"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffe5a9,bg=#111523"

# pane border
set-option -g pane-border-style "fg=#111523"
set-option -g pane-active-border-style "fg=#62697a"

# message text
set-option -g message-style "fg=#acb1bd,bg=#1a1f2d"

# pane number display
set-option -g display-panes-active-colour "#62697a"
set-option -g display-panes-colour "#111523"

# clock
set-window-option -g clock-mode-colour "#91c5ea"

# copy mode highlight
set-window-option -g mode-style "fg=#62697a,bg=#1a1f2d"

# bell
set-window-option -g window-status-bell-style "fg=#0d111d,bg=#d0756c"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#dde1eb,bg=#111523"

# style for command messages
set-option -g message-command-style "fg=#acb1bd,bg=#1a1f2d"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#dde1eb,bg=#0d111d"
  set-window-option -g window-style "fg=#dde1eb,bg=#111523"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#dde1eb,bg=#232837] #S #[fg=#232837,bg=#111523,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#1a1f2d,bg=#111523 nobold, nounderscore, noitalics]#[fg=#62697a,bg=#1a1f2d] %Y-%m-%d  %H:%M #[fg=#dde1eb,bg=#1a1f2d,nobold,noitalics,nounderscore]#[fg=#111523,bg=#dde1eb] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#111523,bg=#eace8c,nobold,noitalics,nounderscore]#[fg=#1a1f2d,bg=#eace8c] #I #[fg=#1a1f2d,bg=#eace8c,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#eace8c,bg=#111523,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#111523,bg=#1a1f2d,noitalics]#[fg=#acb1bd,bg=#1a1f2d] #I #[fg=#acb1bd,bg=#1a1f2d] #W#{?window_zoomed_flag,*Z,}} #[fg=#1a1f2d,bg=#111523,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
