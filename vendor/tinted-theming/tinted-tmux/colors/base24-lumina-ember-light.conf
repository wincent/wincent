# Base24 Lumina Ember Light
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#8c8579,bg=#f4eddf"

# default window title colors
set-window-option -g window-status-style "fg=#8c8579,bg=#f4eddf"

# active window title colors
set-window-option -g window-status-current-style "fg=#874e01,bg=#f4eddf"

# pane border
set-option -g pane-border-style "fg=#f4eddf"
set-option -g pane-active-border-style "fg=#8c8579"

# message text
set-option -g message-style "fg=#4d473c,bg=#e9e2d4"

# pane number display
set-option -g display-panes-active-colour "#8c8579"
set-option -g display-panes-colour "#f4eddf"

# clock
set-window-option -g clock-mode-colour "#256b99"

# copy mode highlight
set-window-option -g mode-style "fg=#8c8579,bg=#e9e2d4"

# bell
set-window-option -g window-status-bell-style "fg=#f9f4ea,bg=#811d1d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#372b1e,bg=#f4eddf"

# style for command messages
set-option -g message-command-style "fg=#4d473c,bg=#e9e2d4"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#372b1e,bg=#f9f4ea"
  set-window-option -g window-style "fg=#372b1e,bg=#f4eddf"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#372b1e,bg=#d8d1c4] #S #[fg=#d8d1c4,bg=#f4eddf,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#e9e2d4,bg=#f4eddf nobold, nounderscore, noitalics]#[fg=#8c8579,bg=#e9e2d4] %Y-%m-%d  %H:%M #[fg=#372b1e,bg=#e9e2d4,nobold,noitalics,nounderscore]#[fg=#f4eddf,bg=#372b1e] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f4eddf,bg=#a06116,nobold,noitalics,nounderscore]#[fg=#e9e2d4,bg=#a06116] #I #[fg=#e9e2d4,bg=#a06116,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#a06116,bg=#f4eddf,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f4eddf,bg=#e9e2d4,noitalics]#[fg=#4d473c,bg=#e9e2d4] #I #[fg=#4d473c,bg=#e9e2d4] #W#{?window_zoomed_flag,*Z,}} #[fg=#e9e2d4,bg=#f4eddf,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
