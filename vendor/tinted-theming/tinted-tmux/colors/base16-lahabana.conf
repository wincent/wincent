# Base16 Lahabana
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#f7f1ff,bg=#19191a"

# default window title colors
set-window-option -g window-status-style "fg=#f7f1ff,bg=#19191a"

# active window title colors
set-window-option -g window-status-current-style "fg=#e5ff9d,bg=#19191a"

# pane border
set-option -g pane-border-style "fg=#29282a"
set-option -g pane-active-border-style "fg=#939098"

# message text
set-option -g message-style "fg=#f9f4ff,bg=#29282a"

# pane number display
set-option -g display-panes-active-colour "#939098"
set-option -g display-panes-colour "#29282a"

# clock
set-window-option -g clock-mode-colour "#fd9353"

# copy mode highlight
set-window-option -g mode-style "fg=#939098,bg=#29282a"

# bell
set-window-option -g window-status-bell-style "fg=#19191a,bg=#fc618d"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#f7f1ff,bg=#19191a"

# style for command messages
set-option -g message-command-style "fg=#f9f4ff,bg=#29282a"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#f7f1ff,bg=#19191a"
  set-window-option -g window-style "fg=#f7f1ff,bg=#19191a"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#f7f1ff,bg=#343335] #S #[fg=#343335,bg=#19191a,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#29282a,bg=#19191a nobold, nounderscore, noitalics]#[fg=#939098,bg=#29282a] %Y-%m-%d  %H:%M #[fg=#f7f1ff,bg=#29282a,nobold,noitalics,nounderscore]#[fg=#19191a,bg=#f7f1ff] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#19191a,bg=#e5ff9d,nobold,noitalics,nounderscore]#[fg=#29282a,bg=#e5ff9d] #I #[fg=#29282a,bg=#e5ff9d,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#e5ff9d,bg=#19191a,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#19191a,bg=#29282a,noitalics]#[fg=#f9f4ff,bg=#29282a] #I #[fg=#f9f4ff,bg=#29282a] #W#{?window_zoomed_flag,*Z,} #[fg=#29282a,bg=#19191a,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
