# Base16 Lichen Chartreuse Light
# Scheme author: Aaron Colichia (https://aaron.colichia.org/)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#2d302b,bg=#f5f7f2"

# default window title colors
set-window-option -g window-status-style "fg=#2d302b,bg=#f5f7f2"

# active window title colors
set-window-option -g window-status-current-style "fg=#506b29,bg=#f5f7f2"

# pane border
set-option -g pane-border-style "fg=#ecefe7"
set-option -g pane-active-border-style "fg=#4e5149"

# message text
set-option -g message-style "fg=#232420,bg=#ecefe7"

# pane number display
set-option -g display-panes-active-colour "#4e5149"
set-option -g display-panes-colour "#ecefe7"

# clock
set-window-option -g clock-mode-colour "#356e8a"

# copy mode highlight
set-window-option -g mode-style "fg=#4e5149,bg=#ecefe7"

# bell
set-window-option -g window-status-bell-style "fg=#f5f7f2,bg=#a34740"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#2d302b,bg=#f5f7f2"

# style for command messages
set-option -g message-command-style "fg=#232420,bg=#ecefe7"

# Optional active/inactive pane state
# BASE16_TMUX_OPTION_ACTIVE is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ] || [ "$BASE16_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#2d302b,bg=#f5f7f2"
  set-window-option -g window-style "fg=#2d302b,bg=#f5f7f2"
}

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ] || [ "$BASE16_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#2d302b,bg=#cfe4ae] #S #[fg=#cfe4ae,bg=#f5f7f2,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#ecefe7,bg=#f5f7f2 nobold, nounderscore, noitalics]#[fg=#4e5149,bg=#ecefe7] %Y-%m-%d  %H:%M #[fg=#2d302b,bg=#ecefe7,nobold,noitalics,nounderscore]#[fg=#f5f7f2,bg=#2d302b] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#f5f7f2,bg=#506b29,nobold,noitalics,nounderscore]#[fg=#ecefe7,bg=#506b29] #I #[fg=#ecefe7,bg=#506b29,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#506b29,bg=#f5f7f2,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#f5f7f2,bg=#ecefe7,noitalics]#[fg=#232420,bg=#ecefe7] #I #[fg=#232420,bg=#ecefe7] #W#{?window_zoomed_flag,*Z,} #[fg=#ecefe7,bg=#f5f7f2,noitalics]"
  set-window-option -g window-status-separator ""
}

# vim: set ft=tmux tw=0:
