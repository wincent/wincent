---
system: "base24"
name: "Abyssal"
slug: "abyssal"
author: "Joss Wright (https://www.weirddatascience.net)"
variant: "dark"
palette:
  # Shades
  base00: "#000000"   # black background
  base01: "#1b2b34"   # lighter background
  base02: "#343d46"   # selection background
  base03: "#4f5b66"   # comments
  base04: "#65737e"   # dark foreground
  base05: "#e0e4e7"   # default foreground
  base06: "#e7e7f7"   # light foreground
  base07: "#f7f7ff"   # lightest foreground, cursor
  # Hues
  base0F: "#dd5500"   # dark red            - deprecated, special
  base08: "#ff7518"   # red                 - variables, markup links
  base12: "#feac57"   # bright red
  base09: "#ff9f10"   # orange              - integers, constants, markup url
  base0A: "#ffcc00"   # yellow              - classes, markup bold
  base13: "#ffee50"   # bright yellow
  base0B: "#39aa62"   # green               - strings, code
  base14: "#4ce070"   # bright green
  base0C: "#40e0d0"   # cyan                - regex, support
  base15: "#20b2aa"   # bright cyan
  base0D: "#01a0e4"   # blue                - functions
  base16: "#4b97c8"   # bright blue
  base0E: "#ab5ccb"   # magenta             - keywords, markup italic
  base17: "#ba8efa"   # bright magenta
  base10: "#000000"   # darker background
  base11: "#000000"   # darkest background

# Reference
#
# | base0x | ANSI | Terminal            | Text Editor                          |
# |--------|------|---------------------|--------------------------------------|
# | base00 | 0    | Black (Background)  | Default Background                   |
# | base01 | 18   | (Darkest Gray)      | Lighter Background (Status bars)     |
# | base02 | 19   | (Dark Gray)         | Selection Background                 |
# | base03 | 8    | Bright Black (Gray) | Comments, Invisibles,                |
# |        |      |                     | Line Highlighting                    |
# | base04 | 20   | (Light Gray)        | Dark Foreground (Status bars)        |
# | base05 | 7    | White               | Default Foreground, Caret,           |
# |        |      |                     | Delimiters, Operators                |
# | base06 | 21   | (Lighter White)     | Light Foreground (Uncommon)          |
# | base07 | 15   | Bright White        | Lightest Foreground (Uncommon)       |
# | base08 | 1    | Red                 | Variables, XML Tags,                 |
# |        |      |                     | Markup Link Text, Markup Lists,      |
# |        |      |                     | Diff Deleted                         |
# | base09 | 16   | (Orange)            | Integers, Boolean, Constants,        |
# |        |      |                     | XML Attributes, Markup Link Url      |
# | base0A | 3    | Yellow              | Classes, Markup Bold,                |
# |        |      |                     | Search Text Background               |
# | base0B | 2    | Green               | Strings, Inherited Class,            |
# |        |      |                     | Markup Code, Diff Inserted           |
# | base0C | 6    | Cyan                | Support, Regular Expressions,        |
# |        |      |                     | Escape Characters, Markup Quotes     |
# | base0D | 4    | Blue                | Functions, Methods, Attribute IDs,   |
# |        |      |                     | Headings                             |
# | base0E | 5    | Magenta             | Keywords, Storage, Selector,         |
# |        |      |                     | Markup Italic, Diff Changed          |
# | base0F | 17   | (Dark Red or Brown) | Deprecated highlighting for          |
# |        |      |                     | methods/functions                    |
# | base10 | -    | (Darker Black)      | Darker Background                    |
# | base11 | -    | (Darkest Black)     | Darkest Background                   |
# | base12 | 9    | Bright Red          | NA                                   |
# | base13 | 11   | Bright Yellow       | NA                                   |
# | base14 | 10   | Bright Green        | NA                                   |
# | base15 | 14   | Bright Cyan         | NA                                   |
# | base16 | 12   | Bright Blue         | NA                                   |
# | base17 | 13   | Bright Magenta      | NA                                   |
