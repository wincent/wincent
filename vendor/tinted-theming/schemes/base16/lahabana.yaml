system: "base16"
name: "Lahabana"
slug: "lahabana"
author: "xscriptor (https://github.com/xscriptor)"
variant: "dark"
palette:
  base00: "#19191a" # background
  base01: "#29282a" # derived: lighter background (ANSI 0 equals background)
  base02: "#343335" # derived: selection background
  base03: "#76747a" # derived: comments (ANSI 8 too close to background)
  base04: "#939098" # derived: dark foreground
  base05: "#f7f1ff" # default foreground
  base06: "#f9f4ff" # derived: light foreground
  base07: "#f7f1ff" # ANSI 15 (bright white)
  base08: "#fc618d" # ANSI 1 (red)
  base09: "#f0b095" # derived: orange (red + yellow)
  base0A: "#e5ff9d" # ANSI 3 (yellow)
  base0B: "#7bd88f" # ANSI 2 (green)
  base0C: "#5ad4e6" # ANSI 6 (cyan)
  base0D: "#fd9353" # ANSI 4 (blue)
  base0E: "#948ae3" # ANSI 5 (magenta)
  base0F: "#a57b6a" # derived: brown (darkened orange)
