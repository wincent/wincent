background     = '#f9efda' # base00
foreground     = '#352516' # base05
black          = '#f9efda' # base00
red            = '#912918' # base08
yellow         = '#654935' # base0A
green          = '#2d7341' # base0B
cyan           = '#006e81' # base0C
blue           = '#2e5fb0' # base0D
