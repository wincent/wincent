# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Parchment Light by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#352516' # base05
selection-foreground = '#e4ddcf' # base02

cursor         = '#352516' # base05
tabs           = '#efe9db' # base01
