# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Madrid by xscriptor (https://github.com/xscriptor)

[colors]
selection-background = '#1a1a1a' # base05
selection-foreground = '#dfdfdf' # base02

cursor         = '#1a1a1a' # base05
tabs           = '#eaeaea' # base01
tabs-active    = '#dfdfdf' # base02

background     = '#fafafa' # base00
foreground     = '#1a1a1a' # base05
