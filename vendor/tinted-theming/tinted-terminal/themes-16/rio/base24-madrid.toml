dim-red          = '#990026' # base08
dim-yellow       = '#8a6408' # base0A
dim-green        = '#007a28' # base0B
dim-cyan         = '#007a9e' # base0C
dim-blue         = '#007a9e' # base0D
dim-magenta      = '#4d2699' # base0E
dim-white        = '#686868' # base04

light-foreground = '#1a1a1a' # base05
light-black      = '#4d4d4d' # base03
light-red        = '#990026' # base12
light-yellow     = '#8a6408' # base13
light-green      = '#007a28' # base14
light-cyan       = '#007a9e' # base15
light-blue       = '#007a9e' # base16
light-magenta    = '#4d2699' # base17
light-white      = '#1a1a1a' # base07
