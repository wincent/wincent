red            = '#990026' # base08
yellow         = '#8a6408' # base0A
green          = '#007a28' # base0B
cyan           = '#007a9e' # base0C
blue           = '#007a9e' # base0D
magenta        = '#4d2699' # base0E
white          = '#1a1a1a' # base05

dim-foreground   = '#1a1a1a' # base05
