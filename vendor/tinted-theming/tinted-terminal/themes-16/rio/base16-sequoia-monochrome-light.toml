background     = '#edeef2' # base00
foreground     = '#282930' # base05
black          = '#edeef2' # base00
red            = '#525666' # base08
yellow         = '#50535e' # base0A
green          = '#2e3038' # base0B
cyan           = '#454752' # base0C
blue           = '#5f6370' # base0D
magenta        = '#50535e' # base0E
white          = '#282930' # base05

dim-foreground   = '#282930' # base05
dim-black        = '#e2e3e8' # base01
dim-red          = '#525666' # base08
dim-yellow       = '#50535e' # base0A
dim-green        = '#2e3038' # base0B
dim-cyan         = '#454752' # base0C
dim-blue         = '#5f6370' # base0D
dim-magenta      = '#50535e' # base0E
dim-white        = '#42434e' # base04

light-foreground = '#282930' # base05
light-black      = '#9da2ad' # base03
light-red        = '#525666' # base08
light-yellow     = '#50535e' # base0A
light-green      = '#2e3038' # base0B
light-cyan       = '#454752' # base0C
light-blue       = '#5f6370' # base0D
light-magenta    = '#50535e' # base0E
light-white      = '#0f1014' # base07
