black          = '#fff8e7' # base00
red            = '#a11d48' # base08
yellow         = '#855500' # base0A
green          = '#a2380c' # base0B
cyan           = '#98263e' # base0C
blue           = '#5940a0' # base0D
magenta        = '#8c1f68' # base0E
