# Rio Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Arroz con Dulce by Richard Martinez

[colors]
selection-background = '#4a2c20' # base05
selection-foreground = '#ead6b8' # base02

cursor         = '#4a2c20' # base05
tabs           = '#f7ebd3' # base01
