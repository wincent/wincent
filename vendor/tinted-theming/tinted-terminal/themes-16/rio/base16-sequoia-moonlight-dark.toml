white          = '#868690' # base05

dim-foreground   = '#868690' # base05
dim-black        = '#111216' # base01
dim-red          = '#f58ee0' # base08
dim-yellow       = '#9898a6' # base0A
dim-green        = '#8eb6f5' # base0B
dim-cyan         = '#ffbb88' # base0C
dim-blue         = '#c58fff' # base0D
dim-magenta      = '#9898a6' # base0E
dim-white        = '#575861' # base04

light-foreground = '#868690' # base05
light-black      = '#43444d' # base03
light-red        = '#f58ee0' # base08
light-yellow     = '#9898a6' # base0A
light-green      = '#8eb6f5' # base0B
light-cyan       = '#ffbb88' # base0C
light-blue       = '#c58fff' # base0D
light-magenta    = '#9898a6' # base0E
