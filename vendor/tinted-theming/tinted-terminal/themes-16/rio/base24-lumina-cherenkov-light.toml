# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Cherenkov Light by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#1f2e53' # base05
selection-foreground = '#e2e6ef' # base02

cursor         = '#1f2e53' # base05
tabs           = '#edf1fb' # base01
tabs-active    = '#e2e6ef' # base02

background     = '#f5f8ff' # base00
foreground     = '#1f2e53' # base05
