# Rio Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Serendipity Midnight by Micheal Andreuzza (https://michaelandreuzza.com/)

[colors]
selection-background = '#dee0ef' # base05
selection-foreground = '#1c1e2d' # base02

cursor         = '#dee0ef' # base05
tabs           = '#1c1e2d' # base01
tabs-active    = '#1c1e2d' # base02

background     = '#151726' # base00
foreground     = '#dee0ef' # base05
black          = '#151726' # base00
red            = '#ee8679' # base08
yellow         = '#a78bfa' # base0A
green          = '#5ba2d0' # base0B
cyan           = '#f8d2c9' # base0C
blue           = '#94b8ff' # base0D
magenta        = '#a78bfa' # base0E
white          = '#dee0ef' # base05

dim-foreground   = '#dee0ef' # base05
dim-black        = '#1c1e2d' # base01
dim-red          = '#ee8679' # base08
dim-yellow       = '#a78bfa' # base0A
dim-green        = '#5ba2d0' # base0B
dim-cyan         = '#f8d2c9' # base0C
dim-blue         = '#94b8ff' # base0D
dim-magenta      = '#a78bfa' # base0E
dim-white        = '#8d8f9e' # base04

light-foreground = '#dee0ef' # base05
light-black      = '#6b6d7c' # base03
light-red        = '#ee8679' # base08
light-yellow     = '#a78bfa' # base0A
light-green      = '#5ba2d0' # base0B
light-cyan       = '#f8d2c9' # base0C
light-blue       = '#94b8ff' # base0D
light-magenta    = '#a78bfa' # base0E
light-white      = '#151726' # base07
