# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Harbor Light by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#1c2d4f' # base05
selection-foreground = '#ebe2d6' # base02

cursor         = '#1c2d4f' # base05
tabs           = '#f6eee1' # base01
tabs-active    = '#ebe2d6' # base02

background     = '#fbf5ec' # base00
foreground     = '#1c2d4f' # base05
black          = '#fbf5ec' # base00
