# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Canopy Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#d8e3d6' # base05
selection-foreground = '#192a1d' # base02

cursor         = '#d8e3d6' # base05
tabs           = '#0f2014' # base01
tabs-active    = '#192a1d' # base02

background     = '#0c1b10' # base00
foreground     = '#d8e3d6' # base05
black          = '#0c1b10' # base00
red            = '#d57068' # base08
yellow         = '#d1cca8' # base0A
green          = '#99d0a4' # base0B
cyan           = '#86cfd7' # base0C
blue           = '#9acaf1' # base0D
magenta        = '#bfb8f3' # base0E
white          = '#d8e3d6' # base05

dim-foreground   = '#d8e3d6' # base05
dim-black        = '#0f2014' # base01
dim-red          = '#d57068' # base08
dim-yellow       = '#d1cca8' # base0A
dim-green        = '#99d0a4' # base0B
dim-cyan         = '#86cfd7' # base0C
dim-blue         = '#9acaf1' # base0D
dim-magenta      = '#bfb8f3' # base0E
dim-white        = '#5b6f5f' # base04

light-foreground = '#d8e3d6' # base05
light-black      = '#223427' # base03
light-red        = '#e1928b' # base12
light-yellow     = '#f4e792' # base13
light-green      = '#b2ebbd' # base14
light-cyan       = '#9fe9f1' # base15
light-blue       = '#c0e3ff' # base16
light-magenta    = '#fdc5f8' # base17
light-white      = '#d8e3d6' # base07
