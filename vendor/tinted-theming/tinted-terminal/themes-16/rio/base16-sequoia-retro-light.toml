# Rio Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Sequoia Retro Light by Micheal Andreuzza (https://michaelandreuzza.com/)

[colors]
selection-background = '#282930' # base05
selection-foreground = '#e2e3e8' # base02

cursor         = '#282930' # base05
tabs           = '#e2e3e8' # base01
