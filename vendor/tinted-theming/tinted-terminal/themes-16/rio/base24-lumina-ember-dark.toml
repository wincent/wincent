background     = '#171511' # base00
foreground     = '#e4ddd0' # base05
black          = '#171511' # base00
red            = '#cb7870' # base08
yellow         = '#e5cc88' # base0A
green          = '#a9cc97' # base0B
cyan           = '#91c7cd' # base0C
blue           = '#94bedc' # base0D
