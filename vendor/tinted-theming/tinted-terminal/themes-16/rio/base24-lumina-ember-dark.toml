# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Ember Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#e4ddd0' # base05
selection-foreground = '#25231e' # base02

cursor         = '#e4ddd0' # base05
tabs           = '#1c1a15' # base01
