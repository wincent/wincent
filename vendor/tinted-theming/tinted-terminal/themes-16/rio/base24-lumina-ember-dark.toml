dim-yellow       = '#e5cc88' # base0A
dim-green        = '#a9cc97' # base0B
dim-cyan         = '#91c7cd' # base0C
dim-blue         = '#94bedc' # base0D
dim-magenta      = '#bbb5e3' # base0E
dim-white        = '#6b6963' # base04

light-foreground = '#e4ddd0' # base05
light-black      = '#2f2d28' # base03
