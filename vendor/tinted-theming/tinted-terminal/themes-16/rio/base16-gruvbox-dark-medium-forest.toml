# Rio Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Gruvbox Dark Medium (Forest) by Muhammad Talha (muhammadtalha.quant@gmail.com), morhetz (https://github.com/morhetz/gruvbox)

[colors]
selection-background = '#d5c4a1' # base05
selection-foreground = '#504945' # base02

cursor         = '#d5c4a1' # base05
tabs           = '#3c3836' # base01
tabs-active    = '#504945' # base02

background     = '#282828' # base00
foreground     = '#d5c4a1' # base05
black          = '#282828' # base00
red            = '#fb4934' # base08
yellow         = '#fabd2f' # base0A
green          = '#b8bb26' # base0B
cyan           = '#5f6c1f' # base0C
blue           = '#b8bb26' # base0D
magenta        = '#96bda2' # base0E
white          = '#d5c4a1' # base05

dim-foreground   = '#d5c4a1' # base05
dim-black        = '#3c3836' # base01
dim-red          = '#fb4934' # base08
dim-yellow       = '#fabd2f' # base0A
dim-green        = '#b8bb26' # base0B
dim-cyan         = '#5f6c1f' # base0C
dim-blue         = '#b8bb26' # base0D
dim-magenta      = '#96bda2' # base0E
dim-white        = '#bdae93' # base04

light-foreground = '#d5c4a1' # base05
light-black      = '#665c50' # base03
light-red        = '#fb4934' # base08
light-yellow     = '#fabd2f' # base0A
light-green      = '#b8bb26' # base0B
light-cyan       = '#5f6c1f' # base0C
light-blue       = '#b8bb26' # base0D
light-magenta    = '#96bda2' # base0E
light-white      = '#fbf1c7' # base07
