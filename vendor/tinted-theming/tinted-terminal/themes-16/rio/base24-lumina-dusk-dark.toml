# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Dusk Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#e0dcea' # base05
selection-foreground = '#282635' # base02

cursor         = '#e0dcea' # base05
tabs           = '#1f1c2b' # base01
