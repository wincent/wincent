# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Parchment Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#efe5d0' # base05
selection-foreground = '#3a3023' # base02

cursor         = '#efe5d0' # base05
tabs           = '#302619' # base01
tabs-active    = '#3a3023' # base02

background     = '#2a2116' # base00
