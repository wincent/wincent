# Rio Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Aftertaerm by Radek Polasek (https://github.com/radekp31), based on Taerminal by cozywigwam

[colors]
selection-background = '#f0f0f0' # base05
selection-foreground = '#3c3e41' # base02

cursor         = '#f0f0f0' # base05
tabs           = '#303234' # base01
tabs-active    = '#3c3e41' # base02

background     = '#26282a' # base00
foreground     = '#f0f0f0' # base05
black          = '#26282a' # base00
red            = '#ff8878' # base08
yellow         = '#fffcb7' # base0A
green          = '#b4fb73' # base0B
cyan           = '#a2e1f8' # base0C
blue           = '#8bbce5' # base0D
magenta        = '#ffb2fe' # base0E
white          = '#f0f0f0' # base05

dim-foreground   = '#f0f0f0' # base05
dim-black        = '#303234' # base01
dim-red          = '#ff8878' # base08
dim-yellow       = '#fffcb7' # base0A
dim-green        = '#b4fb73' # base0B
dim-cyan         = '#a2e1f8' # base0C
dim-blue         = '#8bbce5' # base0D
dim-magenta      = '#ffb2fe' # base0E
dim-white        = '#a8a8a8' # base04

light-foreground = '#f0f0f0' # base05
light-black      = '#6f6f6f' # base03
light-red        = '#ff8878' # base08
light-yellow     = '#fffcb7' # base0A
light-green      = '#b4fb73' # base0B
light-cyan       = '#a2e1f8' # base0C
light-blue       = '#8bbce5' # base0D
light-magenta    = '#ffb2fe' # base0E
light-white      = '#ffffff' # base07
