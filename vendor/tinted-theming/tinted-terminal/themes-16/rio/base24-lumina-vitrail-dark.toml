# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Vitrail Dark by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#f1eee6' # base05
selection-foreground = '#131621' # base02

cursor         = '#f1eee6' # base05
tabs           = '#0a0d17' # base01
tabs-active    = '#131621' # base02

background     = '#070912' # base00
