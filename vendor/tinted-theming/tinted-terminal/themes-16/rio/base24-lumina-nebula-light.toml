dim-red          = '#932222' # base08
dim-yellow       = '#955b01' # base0A
dim-green        = '#007650' # base0B
dim-cyan         = '#016e90' # base0C
dim-blue         = '#3f5777' # base0D
dim-magenta      = '#5d40b1' # base0E
dim-white        = '#888391' # base04

light-foreground = '#2d2c46' # base05
light-black      = '#d6d1df' # base03
