# Rio Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Nebula Light by Razik Ikhlef (https://github.com/RazikSF)

[colors]
selection-background = '#2d2c46' # base05
selection-foreground = '#e6e1ef' # base02

cursor         = '#2d2c46' # base05
tabs           = '#f2edfb' # base01
tabs-active    = '#e6e1ef' # base02

background     = '#f8f4ff' # base00
foreground     = '#2d2c46' # base05
black          = '#f8f4ff' # base00
red            = '#932222' # base08
yellow         = '#955b01' # base0A
green          = '#007650' # base0B
cyan           = '#016e90' # base0C
blue           = '#3f5777' # base0D
magenta        = '#5d40b1' # base0E
white          = '#2d2c46' # base05

dim-foreground   = '#2d2c46' # base05
