# Scheme name: base24 Pastelón de Amarillos
# Scheme author: Richard Martinez (https://sonofmartinus.com)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #fff4d6
foreground #432c3b
selection_background #432c3b
selection_foreground #d69b45

# Cursor colors
cursor #432c3b
cursor_text_color #fff4d6

# URL underline color when hovering with mouse
url_color #684653

# Kitty window border colors
active_border_color #80616b
inactive_border_color #f2d083

# OS Window titlebar colors
wayland_titlebar_color #fff4d6
macos_titlebar_color #fff4d6

# Tab bar colors
active_tab_background #fff4d6
active_tab_foreground #432c3b
inactive_tab_background #f2d083
inactive_tab_foreground #684653
tab_bar_background #f2d083

# The 16 terminal colors
# normal
