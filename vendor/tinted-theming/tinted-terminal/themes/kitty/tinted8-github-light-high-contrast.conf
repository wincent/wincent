## blurb:    

# The basic colors
background #ffffff
foreground #010409
selection_background #3d454c
selection_foreground #010409

# Cursor colors
cursor #010409
cursor_text_color #ffffff

# URL underline color when hovering with mouse
url_color #59636e

# Kitty window border colors
active_border_color #3d454c
