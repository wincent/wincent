# Scheme name: base24 Lumina Harbor Dark
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #0d111d
foreground #dde1eb
selection_background #dde1eb
selection_foreground #1a1f2d

# Cursor colors
cursor #dde1eb
cursor_text_color #0d111d

# URL underline color when hovering with mouse
url_color #62697a

# Kitty window border colors
active_border_color #232837
inactive_border_color #111523

# OS Window titlebar colors
wayland_titlebar_color #0d111d
macos_titlebar_color #0d111d

# Tab bar colors
active_tab_background #0d111d
active_tab_foreground #dde1eb
inactive_tab_background #111523
inactive_tab_foreground #62697a
tab_bar_background #111523

# The 16 terminal colors
# normal
color0 #0d111d
color1 #d0756c
color2 #9bd8b4
color3 #eace8c
color4 #91c5ea
color5 #c1bbef
color6 #91cfd6
color7 #dde1eb

# bright
color8 #232837
color9 #de968e
color10 #b9f1d0
color11 #ffe5a9
color12 #b1deff
color13 #ebc4f5
color14 #aae9f0
color15 #dde1eb

# extended base16 colors
color16 #f4b285
color17 #d3a9dd
color18 #111523
color19 #1a1f2d
color20 #62697a
color21 #acb1bd
