# Scheme name: base24 London
# Scheme author: xscriptor (https://github.com/xscriptor)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #ffffff
foreground #333333
selection_background #333333
selection_foreground #e7e7e7

# Cursor colors
cursor #333333
cursor_text_color #ffffff

# URL underline color when hovering with mouse
url_color #7a7a7a

# Kitty window border colors
active_border_color #333333
inactive_border_color #f1f1f1

# OS Window titlebar colors
wayland_titlebar_color #ffffff
macos_titlebar_color #ffffff

# Tab bar colors
active_tab_background #ffffff
active_tab_foreground #333333
inactive_tab_background #f1f1f1
inactive_tab_foreground #7a7a7a
tab_bar_background #f1f1f1

# The 16 terminal colors
# normal
color0 #ffffff
color1 #333333
color2 #444444
color3 #555555
color4 #666666
color5 #777777
color6 #888888
color7 #333333

# bright
color8 #333333
color9 #444444
color10 #555555
color11 #666666
color12 #777777
color13 #888888
color14 #999999
color15 #aaaaaa

# extended base16 colors
color16 #444444
color17 #303030
color18 #f1f1f1
