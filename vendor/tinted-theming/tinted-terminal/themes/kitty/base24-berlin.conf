# The basic colors
background #000000
foreground #cccccc
selection_background #cccccc
selection_foreground #181818

# Cursor colors
cursor #cccccc
cursor_text_color #000000

# URL underline color when hovering with mouse
url_color #707070

# Kitty window border colors
