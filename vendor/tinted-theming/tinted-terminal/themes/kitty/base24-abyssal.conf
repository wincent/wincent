# Scheme name: base24 Abyssal
# Scheme author: Joss Wright (https://www.weirddatascience.net)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #000000
foreground #e0e4e7
selection_background #e0e4e7
selection_foreground #343d46

# Cursor colors
cursor #e0e4e7
cursor_text_color #000000

# URL underline color when hovering with mouse
url_color #65737e

# Kitty window border colors
active_border_color #4f5b66
inactive_border_color #1b2b34

# OS Window titlebar colors
wayland_titlebar_color #000000
macos_titlebar_color #000000

# Tab bar colors
active_tab_background #000000
active_tab_foreground #e0e4e7
inactive_tab_background #1b2b34
inactive_tab_foreground #65737e
tab_bar_background #1b2b34

# The 16 terminal colors
# normal
color0 #000000
color1 #ff7518
color2 #39aa62
color3 #ffcc00
color4 #01a0e4
color5 #ab5ccb
color6 #40e0d0
color7 #e0e4e7

# bright
color8 #4f5b66
