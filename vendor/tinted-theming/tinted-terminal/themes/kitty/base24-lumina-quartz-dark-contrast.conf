# Scheme name: base24 Lumina Quartz Dark Contrast
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #0d0e0f
foreground #ebeff2
selection_background #ebeff2
selection_foreground #1a1b1d

# Cursor colors
cursor #ebeff2
cursor_text_color #0d0e0f

# URL underline color when hovering with mouse
url_color #68696a

# Kitty window border colors
active_border_color #242526
inactive_border_color #111213

# OS Window titlebar colors
wayland_titlebar_color #0d0e0f
macos_titlebar_color #0d0e0f

# Tab bar colors
active_tab_background #0d0e0f
active_tab_foreground #ebeff2
inactive_tab_background #111213
inactive_tab_foreground #68696a
tab_bar_background #111213

# The 16 terminal colors
# normal
color0 #0d0e0f
color1 #ffa69b
color2 #62d17f
color3 #ffc334
color4 #7fb7ff
color5 #c09aff
color6 #00e2fc
color7 #ebeff2

# bright
color8 #242526
color9 #ffcdc6
color10 #7eeb98
color11 #ffe4b0
color12 #add1ff
color13 #ffadf7
color14 #a6f2ff
color15 #ebeff2

# extended base16 colors
color16 #ff9645
color17 #ec8ce4
color18 #111213
color19 #1a1b1d
color20 #68696a
color21 #b0b1b2
