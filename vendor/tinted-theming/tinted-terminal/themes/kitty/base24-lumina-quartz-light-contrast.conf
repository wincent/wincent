# Scheme name: base24 Lumina Quartz Light Contrast
# Scheme author: Razik Ikhlef (https://github.com/RazikSF)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #fdfdfe
foreground #0e0f13
selection_background #0e0f13
selection_foreground #ebebec

# Cursor colors
cursor #0e0f13
cursor_text_color #fdfdfe

# URL underline color when hovering with mouse
url_color #868687

# Kitty window border colors
active_border_color #dadadc
inactive_border_color #f6f6f8

# OS Window titlebar colors
wayland_titlebar_color #fdfdfe
macos_titlebar_color #fdfdfe

# Tab bar colors
active_tab_background #fdfdfe
active_tab_foreground #0e0f13
inactive_tab_background #f6f6f8
inactive_tab_foreground #868687
tab_bar_background #f6f6f8

# The 16 terminal colors
# normal
