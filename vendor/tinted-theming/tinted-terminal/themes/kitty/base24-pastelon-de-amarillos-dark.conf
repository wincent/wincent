# Scheme name: base24 Pastelón de Amarillos Dark
# Scheme author: Richard Martinez (https://sonofmartinus.com)
# Template author: Tinted Theming (https://github.com/tinted-theming/tinted-terminal)

# The basic colors
background #180d18
foreground #ffe0a3
selection_background #ffe0a3
selection_foreground #432031

# Cursor colors
cursor #ffe0a3
cursor_text_color #180d18

# URL underline color when hovering with mouse
