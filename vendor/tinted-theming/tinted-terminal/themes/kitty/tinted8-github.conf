# vim:ft=kitty

## name:     tinted8 Github Light
## author:   Tinted Theming (https://github.com/tinted-theming)
## upstream: https://github.com/tinted-theming/tinted-terminal
## blurb:    

# The basic colors
background #ffffff
foreground #1f2328
selection_background #3d454c
selection_foreground #1f2328

# Cursor colors
cursor #1f2328
cursor_text_color #ffffff

# URL underline color when hovering with mouse
url_color #59636e

# Kitty window border colors
active_border_color #3d454c
inactive_border_color #f6f8fa

# OS Window titlebar colors
wayland_titlebar_color #ffffff
macos_titlebar_color #ffffff

# Tab bar colors
active_tab_background #ffffff
active_tab_foreground #1f2328
inactive_tab_background #f6f8fa
inactive_tab_foreground #59636e
tab_bar_background #f6f8fa

# The 16 terminal colors
