# OS Window titlebar colors
wayland_titlebar_color #180d18
macos_titlebar_color #180d18

# Tab bar colors
active_tab_background #180d18
active_tab_foreground #ffe0a3
inactive_tab_background #2a1424
inactive_tab_foreground #c39a89
tab_bar_background #2a1424

