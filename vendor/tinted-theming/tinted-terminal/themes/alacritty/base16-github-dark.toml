# base16 Github Dark 256 - alacritty color config
# Tinted Theming (https://github.com/tinted-theming)

# Default colors
[colors.primary]
background = '0x0d1117'
foreground = '0xd1d7e0'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x0d1117'
cursor = '0xd1d7e0'

# Normal colors
[colors.normal]
