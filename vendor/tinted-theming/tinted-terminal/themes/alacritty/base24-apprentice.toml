# base24 Apprentice 256 - alacritty color config
# Romain Lafourcade (https://github.com/romainl)

# Default colors
[colors.primary]
background = '0x262626'
foreground = '0xbcbcbc'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x262626'
cursor = '0xbcbcbc'

