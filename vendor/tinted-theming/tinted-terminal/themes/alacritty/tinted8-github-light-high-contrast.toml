# Github Light High Contrast theme for Alacritty
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Scheme System: tinted8
# Template Author: Tinted Terminal (https://github.com/tinted-theming/tinted-terminal)

# Default colors
[colors.primary]
background = '0xffffff'
foreground = '0x010409'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0xffffff'
cursor = '0x010409'

# Normal colors
[colors.normal]
black = '0x010409'
red = '0xa0111f'
green = '0x024c1a'
yellow = '0x3f2200'
blue = '0x0349b4'
magenta = '0x622cbc'
cyan = '0x1b7c83'
white = '0x59636e'

# Bright colors
[colors.bright]
black = '0x393f46'
red = '0x86061d'
green = '0x055d20'
yellow = '0x4e2c00'
blue = '0x1168e3'
magenta = '0x844ae7'
cyan = '0x3192aa'
white = '0x818b98'
