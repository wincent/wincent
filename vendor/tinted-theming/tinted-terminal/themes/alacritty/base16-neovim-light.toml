# base16 Neovim Light 256 - alacritty color config
# https://github.com/neovim/neovim/blob/master/src/nvim/highlight_group.c

# Default colors
[colors.primary]
background = '0xe0e2ea'
foreground = '0x14161b'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0xe0e2ea'
cursor = '0x14161b'

# Normal colors
[colors.normal]
black = '0xe0e2ea'
red = '0x590008'
green = '0x005523'
yellow = '0x6b5300'
blue = '0x004c73'
magenta = '0x470045'
cyan = '0x007373'
white = '0x14161b'

# Bright colors
[colors.bright]
black = '0x4f5258'
red = '0x590008'
green = '0x005523'
yellow = '0x6b5300'
blue = '0x004c73'
magenta = '0x470045'
cyan = '0x007373'
white = '0x07080d'

