# base24 Berlin 256 - alacritty color config
# xscriptor (https://github.com/xscriptor)

# Default colors
[colors.primary]
background = '0x000000'
foreground = '0xcccccc'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x000000'
cursor = '0xcccccc'

# Normal colors
[colors.normal]
black = '0x000000'
red = '0x999999'
green = '0xbbbbbb'
yellow = '0xdddddd'
blue = '0x888888'
magenta = '0xaaaaaa'
cyan = '0xcccccc'
white = '0xcccccc'

# Bright colors
[colors.bright]
black = '0x333333'
red = '0xbbbbbb'
green = '0xdddddd'
yellow = '0xffffff'
blue = '0xaaaaaa'
magenta = '0xcccccc'
cyan = '0xeeeeee'
white = '0xffffff'

[[colors.indexed_colors]]
index = 16
color = "0xbbbbbb"

[[colors.indexed_colors]]
index = 17
color = "0x7a7a7a"

[[colors.indexed_colors]]
index = 18
color = "0x0e0e0e"

[[colors.indexed_colors]]
index = 19
color = "0x181818"

[[colors.indexed_colors]]
index = 20
color = "0x707070"

[[colors.indexed_colors]]
index = 21
color = "0xd6d6d6"
