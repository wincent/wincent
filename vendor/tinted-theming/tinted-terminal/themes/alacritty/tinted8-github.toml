# Github Light theme for Alacritty
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Scheme System: tinted8
# Template Author: Tinted Terminal (https://github.com/tinted-theming/tinted-terminal)

# Default colors
[colors.primary]
background = '0xffffff'
foreground = '0x1f2328'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0xffffff'
cursor = '0x1f2328'

# Normal colors
[colors.normal]
black = '0x1f2328'
red = '0xcf222e'
green = '0x116329'
yellow = '0x4d2d00'
blue = '0x0969da'
magenta = '0x8250df'
cyan = '0x1b7c83'
white = '0x59636e'

# Bright colors
[colors.bright]
black = '0x393f46'
red = '0xa40e26'
green = '0x1a7f37'
yellow = '0x633c01'
blue = '0x218bff'
magenta = '0xa475f9'
cyan = '0x3192aa'
white = '0x818b98'
