# base24 Miami 256 - alacritty color config
# xscriptor (https://github.com/xscriptor)

# Default colors
[colors.primary]
background = '0x000000'
foreground = '0xf7f1ff'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x000000'
cursor = '0xf7f1ff'

# Normal colors
[colors.normal]
