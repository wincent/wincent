# base24 Github Light 256 - alacritty color config
# Tinted Theming (https://github.com/tinted-theming)

# Default colors
[colors.primary]
background = '0xffffff'
foreground = '0x454c54'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
