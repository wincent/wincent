# base16 London 256 - alacritty color config
# xscriptor (https://github.com/xscriptor)

# Default colors
[colors.primary]
background = '0xffffff'
foreground = '0x333333'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0xffffff'
cursor = '0x333333'

# Normal colors
[colors.normal]
black = '0xffffff'
red = '0x333333'
green = '0x444444'
yellow = '0x555555'
blue = '0x666666'
magenta = '0x777777'
cyan = '0x888888'
white = '0x333333'

# Bright colors
[colors.bright]
black = '0x333333'
red = '0x333333'
green = '0x444444'
yellow = '0x555555'
blue = '0x666666'
magenta = '0x777777'
cyan = '0x888888'
white = '0xaaaaaa'

