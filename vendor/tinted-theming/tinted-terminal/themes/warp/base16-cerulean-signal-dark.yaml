# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Cerulean Signal Dark by Aaron Colichia (https://aaron.colichia.org/)

name: Base16 Cerulean Signal Dark
accent: "#7dd3ff" # base0D
cursor: "#dce6f2" # base05
background: "#101722" # base00
foreground: "#dce6f2" # base05
details: darker

terminal_colors:
  bright:
    black: "#101722" # base00
    red: "#ff8a9a" # base08
    yellow: "#e2c85f" # base0A
    green: "#70e1b0" # base0B
    cyan: "#58d9df" # base0C
    blue: "#7dd3ff" # base0D
    magenta: "#ff74d4" # base0E
    white: "#dce6f2" # base05

  normal:
    black: "#8fa0b5" # base03
    red: "#ff8a9a" # base08
    yellow: "#e2c85f" # base0A
    green: "#70e1b0" # base0B
    cyan: "#58d9df" # base0C
    blue: "#7dd3ff" # base0D
    magenta: "#ff74d4" # base0E
    white: "#f7f9fc" # base07
