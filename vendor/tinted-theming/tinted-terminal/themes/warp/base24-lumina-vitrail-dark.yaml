# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Vitrail Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Vitrail Dark
accent: "#7299ff" # base0D
cursor: "#f1eee6" # base05
background: "#070912" # base00
foreground: "#f1eee6" # base05
details: darker

terminal_colors:
  normal:
    black: "#070912" # base00
    red: "#ff763b" # base08
    yellow: "#fbca3f" # base0A
    green: "#76d983" # base0B
    cyan: "#4de0f7" # base0C
    blue: "#7299ff" # base0D
    magenta: "#b8acff" # base0E
    white: "#f1eee6" # base05

  bright:
    black: "#1c1f2b" # base03
    red: "#ffa37f" # base12
    yellow: "#ffe6a7" # base13
    green: "#93f39f" # base14
    cyan: "#abf2ff" # base15
    blue: "#97b6ff" # base16
    magenta: "#efb2ff" # base17
    white: "#f1eee6" # base07
