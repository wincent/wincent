# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Nebula Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Nebula Light
accent: "#3f5777" # base0D
cursor: "#2d2c46" # base05
background: "#f8f4ff" # base00
foreground: "#2d2c46" # base05
details: lighter

terminal_colors:
