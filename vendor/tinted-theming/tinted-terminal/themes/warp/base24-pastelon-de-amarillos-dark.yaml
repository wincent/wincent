# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Pastelón de Amarillos Dark by Richard Martinez (https://sonofmartinus.com)

name: Base24 Pastelón de Amarillos Dark
accent: "#4c84bd" # base0D
cursor: "#ffe0a3" # base05
background: "#180d18" # base00
foreground: "#ffe0a3" # base05
details: darker

terminal_colors:
  normal:
    black: "#180d18" # base00
    red: "#d95361" # base08
    yellow: "#d8a93a" # base0A
    green: "#36aa72" # base0B
    cyan: "#31a99e" # base0C
    blue: "#4c84bd" # base0D
    magenta: "#b765b0" # base0E
    white: "#ffe0a3" # base05

  bright:
    black: "#a0747c" # base03
    red: "#ffd052" # base12
    yellow: "#43d98d" # base13
    green: "#3ed2c3" # base14
    cyan: "#64abf4" # base15
    blue: "#e581dc" # base16
    magenta: "#ed7d51" # base17
    white: "#fff7e6" # base07
