# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Apprentice by Romain Lafourcade (https://github.com/romainl)

name: Base16 Apprentice
accent: "#5f87af" # base0D
cursor: "#bcbcbc" # base05
background: "#262626" # base00
foreground: "#bcbcbc" # base05
details: darker

terminal_colors:
  normal:
    black: "#262626" # base00
    red: "#af5f5f" # base08
    yellow: "#87875f" # base0A
    green: "#5f875f" # base0B
    cyan: "#5f8787" # base0C
    blue: "#5f87af" # base0D
    magenta: "#5f5f87" # base0E
    white: "#bcbcbc" # base05

  bright:
    black: "#444444" # base03
    red: "#af5f5f" # base08
    yellow: "#87875f" # base0A
    green: "#5f875f" # base0B
    cyan: "#5f8787" # base0C
    blue: "#5f87af" # base0D
    magenta: "#5f5f87" # base0E
    white: "#ffffff" # base07
