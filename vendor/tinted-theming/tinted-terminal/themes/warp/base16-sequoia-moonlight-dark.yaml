# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Sequoia Moonlight Dark by Micheal Andreuzza (https://michaelandreuzza.com/)

name: Base16 Sequoia Moonlight Dark
accent: "#c58fff" # base0D
cursor: "#868690" # base05
background: "#0f1014" # base00
foreground: "#868690" # base05
details: darker

terminal_colors:
  normal:
    black: "#0f1014" # base00
    red: "#f58ee0" # base08
    yellow: "#9898a6" # base0A
    green: "#8eb6f5" # base0B
    cyan: "#ffbb88" # base0C
    blue: "#c58fff" # base0D
    magenta: "#9898a6" # base0E
    white: "#868690" # base05

  bright:
    black: "#43444d" # base03
    red: "#f58ee0" # base08
    yellow: "#9898a6" # base0A
    green: "#8eb6f5" # base0B
    cyan: "#ffbb88" # base0C
    blue: "#c58fff" # base0D
    magenta: "#9898a6" # base0E
    white: "#0f1014" # base07
