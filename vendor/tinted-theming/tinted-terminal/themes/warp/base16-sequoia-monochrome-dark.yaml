# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Sequoia Monochrome Dark by Micheal Andreuzza (https://michaelandreuzza.com/)

name: Base16 Sequoia Monochrome Dark
accent: "#7c829d" # base0D
cursor: "#868690" # base05
background: "#0f1014" # base00
foreground: "#868690" # base05
details: darker

terminal_colors:
  normal:
    black: "#0f1014" # base00
    red: "#999eb2" # base08
    yellow: "#d3d5de" # base0A
    green: "#626983" # base0B
    cyan: "#b6bac8" # base0C
    blue: "#7c829d" # base0D
    magenta: "#d3d5de" # base0E
    white: "#868690" # base05

  bright:
    black: "#43444d" # base03
    red: "#999eb2" # base08
    yellow: "#d3d5de" # base0A
    green: "#626983" # base0B
    cyan: "#b6bac8" # base0C
    blue: "#7c829d" # base0D
    magenta: "#d3d5de" # base0E
    white: "#0f1014" # base07
