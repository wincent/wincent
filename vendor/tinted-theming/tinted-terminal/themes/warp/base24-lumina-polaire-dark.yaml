# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Polaire Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Polaire Dark
accent: "#aeccf2" # base0D
cursor: "#d7e1e8" # base05
background: "#0f1a21" # base00
foreground: "#d7e1e8" # base05
details: darker

terminal_colors:
  normal:
    black: "#0f1a21" # base00
    red: "#cd776f" # base08
    yellow: "#e2c682" # base0A
    green: "#a9d6b1" # base0B
    cyan: "#8cd9f4" # base0C
    blue: "#aeccf2" # base0D
    magenta: "#bfbaf7" # base0E
    white: "#d7e1e8" # base05

  bright:
    black: "#25323b" # base03
    red: "#dc978f" # base12
    yellow: "#fde099" # base13
    green: "#c2f1ca" # base14
    cyan: "#c2efff" # base15
    blue: "#d1e5ff" # base16
    magenta: "#ffd3fa" # base17
    white: "#d7e1e8" # base07
