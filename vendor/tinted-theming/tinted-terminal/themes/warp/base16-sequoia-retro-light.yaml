# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Sequoia Retro Light by Micheal Andreuzza (https://michaelandreuzza.com/)

name: Base16 Sequoia Retro Light
accent: "#456a82" # base0D
cursor: "#282930" # base05
background: "#edeef2" # base00
foreground: "#282930" # base05
details: lighter

terminal_colors:
  normal:
    black: "#edeef2" # base00
    red: "#5f7982" # base08
    yellow: "#bf5238" # base0A
    green: "#4a704e" # base0B
    cyan: "#8a6539" # base0C
    blue: "#456a82" # base0D
    magenta: "#bf5238" # base0E
    white: "#282930" # base05

  bright:
    black: "#565760" # base03
    red: "#5f7982" # base08
    yellow: "#bf5238" # base0A
    green: "#4a704e" # base0B
    cyan: "#8a6539" # base0C
    blue: "#456a82" # base0D
    magenta: "#bf5238" # base0E
    white: "#0f1014" # base07
