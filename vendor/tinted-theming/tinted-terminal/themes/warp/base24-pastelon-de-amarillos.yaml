# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Pastelón de Amarillos by Richard Martinez (https://sonofmartinus.com)

name: Base24 Pastelón de Amarillos
accent: "#365f91" # base0D
cursor: "#432c3b" # base05
background: "#fff4d6" # base00
foreground: "#432c3b" # base05
details: lighter

terminal_colors:
  normal:
    black: "#fff4d6" # base00
    red: "#a63d4a" # base08
    yellow: "#846600" # base0A
    green: "#327056" # base0B
    cyan: "#276e6c" # base0C
    blue: "#365f91" # base0D
    magenta: "#784a78" # base0E
    white: "#432c3b" # base05

  bright:
    black: "#80616b" # base03
    red: "#a86e00" # base12
    yellow: "#007b4e" # base13
    green: "#007b78" # base14
    cyan: "#005eb8" # base15
    blue: "#9b3395" # base16
    magenta: "#87301f" # base17
    white: "#1c0f20" # base07
