# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Jellybeans by FredHappyface (https://github.com/fredHappyface), converted to Base16 by https://github.com/nonetrix

name: Base16 Jellybeans
accent: "#b1d8f6" # base0D
cursor: "#d5d5d5" # base05
background: "#121212" # base00
foreground: "#d5d5d5" # base05
details: darker

terminal_colors:
  bright:
    black: "#121212" # base00
    red: "#ffa1a1" # base08
    yellow: "#ffdca0" # base0A
    green: "#bddeab" # base0B
    cyan: "#1ab2a8" # base0C
    blue: "#b1d8f6" # base0D
    magenta: "#fbdaff" # base0E
    white: "#d5d5d5" # base05

  normal:
    black: "#c5c5c5" # base03
    red: "#ffa1a1" # base08
    yellow: "#ffdca0" # base0A
    green: "#bddeab" # base0B
    cyan: "#1ab2a8" # base0C
    blue: "#b1d8f6" # base0D
    magenta: "#fbdaff" # base0E
    white: "#ffffff" # base07
