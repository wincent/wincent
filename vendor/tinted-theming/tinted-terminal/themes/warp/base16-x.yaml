# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: X by xscriptor (https://github.com/xscriptor)

name: Base16 X
accent: "#fd9353" # base0D
cursor: "#f7f1ff" # base05
background: "#050505" # base00
foreground: "#f7f1ff" # base05
details: darker

terminal_colors:
  normal:
    black: "#050505" # base00
    red: "#fc618d" # base08
    yellow: "#fce566" # base0A
    green: "#7bd88f" # base0B
    cyan: "#5ad4e6" # base0C
    blue: "#fd9353" # base0D
    magenta: "#948ae3" # base0E
    white: "#f7f1ff" # base05

  bright:
    black: "#6b686e" # base03
    red: "#fc618d" # base08
    yellow: "#fce566" # base0A
    green: "#7bd88f" # base0B
    cyan: "#5ad4e6" # base0C
    blue: "#fd9353" # base0D
    magenta: "#948ae3" # base0E
    white: "#f7f1ff" # base07
