# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Ember Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Ember Light
accent: "#256b99" # base0D
cursor: "#372b1e" # base05
