# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Bogota by xscriptor (https://github.com/xscriptor)

name: Base16 Bogota
accent: "#47e6ff" # base0D
cursor: "#f7f1ff" # base05
background: "#200b0a" # base00
foreground: "#f7f1ff" # base05
details: darker

terminal_colors:
  normal:
    black: "#200b0a" # base00
    red: "#fc618d" # base08
    yellow: "#ffed89" # base0A
    green: "#7bd88f" # base0B
    cyan: "#47e6ff" # base0C
    blue: "#47e6ff" # base0D
    magenta: "#ff9999" # base0E
    white: "#f7f1ff" # base05

  bright:
    black: "#525053" # base03
    red: "#fc618d" # base08
    yellow: "#ffed89" # base0A
    green: "#7bd88f" # base0B
    cyan: "#47e6ff" # base0C
    blue: "#47e6ff" # base0D
    magenta: "#ff9999" # base0E
    white: "#f7f1ff" # base07
