# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Parchment Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Parchment Light
accent: "#2e5fb0" # base0D
