# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Abyssal by Joss Wright (https://www.weirddatascience.net)

name: Base24 Abyssal
accent: "#01a0e4" # base0D
cursor: "#e0e4e7" # base05
background: "#000000" # base00
foreground: "#e0e4e7" # base05
details: darker

terminal_colors:
  normal:
    black: "#000000" # base00
    red: "#ff7518" # base08
    yellow: "#ffcc00" # base0A
    green: "#39aa62" # base0B
    cyan: "#40e0d0" # base0C
    blue: "#01a0e4" # base0D
    magenta: "#ab5ccb" # base0E
    white: "#e0e4e7" # base05

  bright:
    black: "#4f5b66" # base03
    red: "#feac57" # base12
    yellow: "#ffee50" # base13
    green: "#4ce070" # base14
    cyan: "#20b2aa" # base15
    blue: "#4b97c8" # base16
    magenta: "#ba8efa" # base17
    white: "#f7f7ff" # base07
