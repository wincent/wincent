# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Github Light Colorblind by Tinted Theming (https://github.com/tinted-theming)

name: Base24 Github Light Colorblind
accent: "#0969da" # base0D
cursor: "#454c54" # base05
background: "#ffffff" # base00
foreground: "#454c54" # base05
details: lighter

terminal_colors:
  normal:
    black: "#ffffff" # base00
    red: "#bc4c00" # base08
    yellow: "#9a6700" # base0A
    green: "#0550ae" # base0B
    cyan: "#1b7c83" # base0C
    blue: "#0969da" # base0D
    magenta: "#8250df" # base0E
    white: "#454c54" # base05

  bright:
    black: "#818b98" # base03
    red: "#953800" # base12
    yellow: "#633c01" # base13
    green: "#0969da" # base14
    cyan: "#3192aa" # base15
    blue: "#218bff" # base16
    magenta: "#a475f9" # base17
    white: "#1f2328" # base07
