# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Sequoia Retro Dark by Micheal Andreuzza (https://michaelandreuzza.com/)

name: Base16 Sequoia Retro Dark
accent: "#5c87a4" # base0D
cursor: "#868690" # base05
background: "#0f1014" # base00
foreground: "#868690" # base05
details: darker

terminal_colors:
  normal:
    black: "#0f1014" # base00
    red: "#829fa7" # base08
    yellow: "#da674b" # base0A
    green: "#648f68" # base0B
    cyan: "#a27e57" # base0C
    blue: "#5c87a4" # base0D
    magenta: "#da674b" # base0E
    white: "#868690" # base05

  bright:
    black: "#43444d" # base03
    red: "#829fa7" # base08
    yellow: "#da674b" # base0A
    green: "#648f68" # base0B
    cyan: "#a27e57" # base0C
    blue: "#5c87a4" # base0D
    magenta: "#da674b" # base0E
    white: "#0f1014" # base07
