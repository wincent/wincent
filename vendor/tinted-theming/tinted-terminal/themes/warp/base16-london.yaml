# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: London by xscriptor (https://github.com/xscriptor)

name: Base16 London
accent: "#666666" # base0D
cursor: "#333333" # base05
background: "#ffffff" # base00
foreground: "#333333" # base05
details: lighter

terminal_colors:
  normal:
    black: "#ffffff" # base00
    red: "#333333" # base08
    yellow: "#555555" # base0A
    green: "#444444" # base0B
    cyan: "#888888" # base0C
    blue: "#666666" # base0D
    magenta: "#777777" # base0E
    white: "#333333" # base05

  bright:
    black: "#333333" # base03
    red: "#333333" # base08
    yellow: "#555555" # base0A
    green: "#444444" # base0B
    cyan: "#888888" # base0C
    blue: "#666666" # base0D
    magenta: "#777777" # base0E
    white: "#aaaaaa" # base07
