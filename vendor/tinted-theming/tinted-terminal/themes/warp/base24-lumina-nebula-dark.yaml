# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Nebula Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Nebula Dark
accent: "#c6d6e8" # base0D
cursor: "#dde1ec" # base05
background: "#161826" # base00
foreground: "#dde1ec" # base05
details: darker

terminal_colors:
  normal:
    black: "#161826" # base00
    red: "#d57068" # base08
    yellow: "#f3c085" # base0A
    green: "#8fdcba" # base0B
    cyan: "#88d2da" # base0C
    blue: "#c6d6e8" # base0D
    magenta: "#b0a4f8" # base0E
    white: "#dde1ec" # base05

  bright:
    black: "#2d3041" # base03
    red: "#e2928a" # base12
    yellow: "#ffdfba" # base13
    green: "#b0f5d5" # base14
    cyan: "#a1ecf5" # base15
    blue: "#d8eaff" # base16
    magenta: "#ffc8f9" # base17
    white: "#dde1ec" # base07
