# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Github Dark by Tinted Theming (https://github.com/tinted-theming)

name: Base24 Github Dark
accent: "#58a6ff" # base0D
cursor: "#d1d7e0" # base05
background: "#0d1117" # base00
foreground: "#d1d7e0" # base05
details: darker

terminal_colors:
