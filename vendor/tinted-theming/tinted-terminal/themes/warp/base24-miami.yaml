# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Miami by xscriptor (https://github.com/xscriptor)

name: Base24 Miami
accent: "#00ffa8" # base0D
cursor: "#f7f1ff" # base05
background: "#000000" # base00
foreground: "#f7f1ff" # base05
details: darker

terminal_colors:
  normal:
    black: "#000000" # base00
    red: "#ff4c8b" # base08
    yellow: "#ffd84c" # base0A
    green: "#7fffd4" # base0B
    cyan: "#47cfff" # base0C
    blue: "#00ffa8" # base0D
    magenta: "#d36cff" # base0E
    white: "#f7f1ff" # base05

  bright:
    black: "#69676c" # base03
    red: "#ff4c8b" # base12
    yellow: "#ffd84c" # base13
    green: "#7fffd4" # base14
    cyan: "#47cfff" # base15
    blue: "#00ffa8" # base16
    magenta: "#d36cff" # base17
    white: "#f7f1ff" # base07
