# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Oxblood Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Oxblood Dark
accent: "#9ac3f8" # base0D
cursor: "#e8d6dc" # base05
background: "#200f16" # base00
foreground: "#e8d6dc" # base05
details: darker

terminal_colors:
