# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Github Dark High Contrast by Tinted Theming (https://github.com/tinted-theming)

name: Base24 Github Dark High Contrast
accent: "#71b7ff" # base0D
cursor: "#d1d7e0" # base05
background: "#0d1117" # base00
foreground: "#d1d7e0" # base05
details: darker

terminal_colors:
  normal:
    black: "#0d1117" # base00
    red: "#ff9492" # base08
    yellow: "#f0b72f" # base0A
    green: "#28d751" # base0B
    cyan: "#39c5cf" # base0C
    blue: "#71b7ff" # base0D
    magenta: "#cb9eff" # base0E
    white: "#d1d7e0" # base05

  bright:
    black: "#656c76" # base03
    red: "#ffb1af" # base12
    yellow: "#f7c843" # base13
    green: "#4ae168" # base14
    cyan: "#56d4dd" # base15
    blue: "#91cbff" # base16
    magenta: "#dbb7ff" # base17
    white: "#ffffff" # base07
