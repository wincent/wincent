# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Github Dark Colorblind by Tinted Theming (https://github.com/tinted-theming)

name: Base24 Github Dark Colorblind
accent: "#58a6ff" # base0D
cursor: "#d1d7e0" # base05
background: "#0d1117" # base00
foreground: "#d1d7e0" # base05
details: darker

terminal_colors:
  normal:
    black: "#0d1117" # base00
    red: "#f0883e" # base08
    yellow: "#d29922" # base0A
    green: "#58a6ff" # base0B
    cyan: "#39c5cf" # base0C
    blue: "#58a6ff" # base0D
    magenta: "#be8fff" # base0E
    white: "#d1d7e0" # base05

  bright:
    black: "#656c76" # base03
    red: "#ffa657" # base12
    yellow: "#e3b341" # base13
    green: "#79c0ff" # base14
    cyan: "#56d4dd" # base15
    blue: "#79c0ff" # base16
    magenta: "#d2a8ff" # base17
    white: "#ffffff" # base07
