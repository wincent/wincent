# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Quartz Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Quartz Light
accent: "#446894" # base0D
cursor: "#30353b" # base05
