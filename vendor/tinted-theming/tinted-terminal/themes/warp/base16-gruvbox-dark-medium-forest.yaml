# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Gruvbox Dark Medium (Forest) by Muhammad Talha (muhammadtalha.quant@gmail.com), morhetz (https://github.com/morhetz/gruvbox)

name: Base16 Gruvbox Dark Medium (Forest)
accent: "#b8bb26" # base0D
cursor: "#d5c4a1" # base05
background: "#282828" # base00
foreground: "#d5c4a1" # base05
details: darker

terminal_colors:
  bright:
    black: "#282828" # base00
    red: "#fb4934" # base08
    yellow: "#fabd2f" # base0A
    green: "#b8bb26" # base0B
    cyan: "#5f6c1f" # base0C
    blue: "#b8bb26" # base0D
    magenta: "#96bda2" # base0E
    white: "#d5c4a1" # base05

  normal:
    black: "#665c50" # base03
    red: "#fb4934" # base08
    yellow: "#fabd2f" # base0A
    green: "#b8bb26" # base0B
    cyan: "#5f6c1f" # base0C
    blue: "#b8bb26" # base0D
    magenta: "#96bda2" # base0E
    white: "#fbf1c7" # base07
