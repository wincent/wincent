# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Cerulean Signal Light by Aaron Colichia (https://aaron.colichia.org/)

name: Base16 Cerulean Signal Light
accent: "#006fa8" # base0D
cursor: "#232b38" # base05
background: "#f7f9fc" # base00
foreground: "#232b38" # base05
details: lighter

terminal_colors:
  bright:
    black: "#f7f9fc" # base00
    red: "#b4233d" # base08
    yellow: "#6f6300" # base0A
    green: "#17795e" # base0B
    cyan: "#00727e" # base0C
    blue: "#006fa8" # base0D
    magenta: "#a0007d" # base0E
    white: "#232b38" # base05

  normal:
    black: "#637287" # base03
    red: "#b4233d" # base08
    yellow: "#6f6300" # base0A
    green: "#17795e" # base0B
    cyan: "#00727e" # base0C
    blue: "#006fa8" # base0D
    magenta: "#a0007d" # base0E
    white: "#141d2a" # base07
