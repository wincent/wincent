# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lichen Chartreuse Light by Aaron Colichia (https://aaron.colichia.org/)

name: Base24 Lichen Chartreuse Light
accent: "#356e8a" # base0D
cursor: "#2d302b" # base05
background: "#f5f7f2" # base00
foreground: "#2d302b" # base05
details: lighter

terminal_colors:
  normal:
    black: "#f5f7f2" # base00
    red: "#a34740" # base08
    yellow: "#506b29" # base0A
    green: "#2f7462" # base0B
    cyan: "#356569" # base0C
    blue: "#356e8a" # base0D
    magenta: "#6e5689" # base0E
    white: "#2d302b" # base05

  bright:
    black: "#687161" # base03
    red: "#a34740" # base12
    yellow: "#875e20" # base13
    green: "#506b29" # base14
    cyan: "#3f6464" # base15
    blue: "#3b6d86" # base16
    magenta: "#8a4f67" # base17
    white: "#151613" # base07
