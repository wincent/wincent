# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Ember Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Ember Dark
accent: "#94bedc" # base0D
cursor: "#e4ddd0" # base05
background: "#171511" # base00
foreground: "#e4ddd0" # base05
details: darker

terminal_colors:
