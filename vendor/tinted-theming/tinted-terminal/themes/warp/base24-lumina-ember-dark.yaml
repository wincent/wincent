    blue: "#94bedc" # base0D
    magenta: "#bbb5e3" # base0E
    white: "#e4ddd0" # base05

  bright:
    black: "#2f2d28" # base03
    red: "#da9890" # base12
    yellow: "#ffe6a2" # base13
