# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Vitrail Light by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Vitrail Light
accent: "#1729b2" # base0D
cursor: "#0f141d" # base05
background: "#fcfaf4" # base00
foreground: "#0f141d" # base05
details: lighter

terminal_colors:
