# Tinted Terminal base24 color theme (https://github.com/tinted-theming)
# Color scheme: Lumina Parchment Dark by Razik Ikhlef (https://github.com/RazikSF)

name: Base24 Lumina Parchment Dark
accent: "#97bdf4" # base0D
cursor: "#efe5d0" # base05
background: "#2a2116" # base00
foreground: "#efe5d0" # base05
details: darker

terminal_colors:
  normal:
    black: "#2a2116" # base00
    red: "#d47169" # base08
