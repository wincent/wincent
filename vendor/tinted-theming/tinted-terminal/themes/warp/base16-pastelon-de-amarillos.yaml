# Tinted Terminal base16 color theme (https://github.com/tinted-theming)
# Color scheme: Pastelón de Amarillos by Richard Martinez (https://sonofmartinus.com)

name: Base16 Pastelón de Amarillos
accent: "#1e5da8" # base0D
cursor: "#432c3b" # base05
background: "#fff4d6" # base00
foreground: "#432c3b" # base05
details: lighter

terminal_colors:
  bright:
    black: "#fff4d6" # base00
    red: "#bd3548" # base08
    yellow: "#946400" # base0A
    green: "#167451" # base0B
    cyan: "#007270" # base0C
    blue: "#1e5da8" # base0D
    magenta: "#8d3f89" # base0E
    white: "#432c3b" # base05

  normal:
    black: "#80616b" # base03
    red: "#bd3548" # base08
    yellow: "#946400" # base0A
    green: "#167451" # base0B
    cyan: "#007270" # base0C
    blue: "#1e5da8" # base0D
    magenta: "#8d3f89" # base0E
    white: "#1c0f20" # base07
